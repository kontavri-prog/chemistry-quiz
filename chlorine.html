
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Експрес кейс — Хлор</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #101827, #263b32);
}
.card {
    width: 100%;
    max-width: 650px;
    padding: 35px;
    border-radius: 22px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 15px 45px rgba(0,0,0,0.35);
}
h1 { text-align: center; margin-top: 0; }
.subtitle {
    text-align: center;
    color: #b8d6bd;
    margin-bottom: 28px;
}
.progress {
    height: 8px;
    background: #34433b;
    border-radius: 10px;
    margin-bottom: 15px;
    overflow: hidden;
}
.progress-bar {
    height: 100%;
    width: 0%;
    background: #a4d65e;
    transition: width .3s;
}
.counter {
    text-align: center;
    color: #b8d6bd;
    margin-bottom: 22px;
}
.question {
    font-size: 20px;
    line-height: 1.5;
    margin-bottom: 22px;
}
.answers {
    display: grid;
    gap: 12px;
}
.answer {
    padding: 16px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 12px;
    background: rgba(255,255,255,.07);
    color: white;
    font-size: 17px;
    text-align: left;
    cursor: pointer;
    transition: .2s;
}
.answer:hover:not(:disabled) {
    background: rgba(164,214,94,.2);
    border-color: #a4d65e;
}
.answer:disabled { cursor: default; opacity: 1; }
.answer.correct {
    background: rgba(46,160,90,.3);
    border-color: #4ade80;
}
.answer.wrong {
    background: rgba(220,60,60,.3);
    border-color: #f87171;
}
.feedback {
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    line-height: 1.5;
    display: none;
}
.feedback.good { display: block; background: rgba(46,160,90,.2); }
.feedback.bad { display: block; background: rgba(220,60,60,.2); }
.main-btn {
    width: 100%;
    padding: 16px;
    margin-top: 22px;
    border: none;
    border-radius: 12px;
    background: #a4d65e;
    color: #17230e;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}
.main-btn:hover { background: #b8e879; }
.result { text-align: center; }
.result h2 { font-size: 30px; }
.review {
    text-align: left;
    line-height: 1.6;
    margin-top: 20px;
}
.review-item {
    padding: 14px;
    margin-bottom: 12px;
    background: rgba(255,255,255,.07);
    border-radius: 12px;
}
.hidden { display: none; }
</style>
</head>
<body>

<div class="card">
    <div id="quiz">
        <h1>🧪 Хлор (Cl)</h1>
        <div class="subtitle">ЕКСПРЕС КЕЙС</div>

        <div class="progress">
            <div class="progress-bar" id="progress"></div>
        </div>

        <div id="counter" class="counter"></div>
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>

        <button class="main-btn hidden" id="next" onclick="nextQuestion()">
            Наступне питання
        </button>
    </div>

    <div id="result" class="result hidden"></div>
</div>

<script>
const questions = [
    {
        question: "Питання (STEM): Токсичний жовто-зелений газ, чиї сполуки щодня рятують мільйони людей через знезараження питної води (Z = 17). Яка електронна формула відповідає цьому атому?",
        answers: [
            "1s² 2s² 2p⁶ 3s² 3p⁵",
            "1s² 2s² 2p⁶ 3s² 3p⁶",
            "1s² 2s² 2p⁵",
            "1s² 2s² 2p⁶ 3s¹"
        ],
        correct: 0,
        explanation: "Правильно! Хлор має 17 електронів. Їх розподіл за підрівнями: 2 + 2 + 6 + 2 + 5 = 17."
    },
    {
        question: "Який ступінь окиснення має Хлор у сполуці NaCl?",
        answers: [
            "+1",
            "−1",
            "+5",
            "0"
        ],
        correct: 1,
        explanation: "Натрій має ступінь окиснення +1, тому Хлор у NaCl має −1. Сумарний заряд сполуки дорівнює нулю."
    },
    {
        question: "Який ступінь окиснення має Хлор у сполуці HClO₃?",
        answers: [
            "−1",
            "+1",
            "+5",
            "+7"
        ],
        correct: 2,
        explanation: "У HClO₃ Гідроген має +1, а три атоми Оксигену разом −6. Отже, Хлор має ступінь окиснення +5."
    },
    {
        question: "Яку валентність найчастіше проявляє Хлор у сполуці HCl?",
        answers: [
            "I",
            "II",
            "III",
            "IV"
        ],
        correct: 0,
        explanation: "У HCl атом Хлору утворює один хімічний зв'язок з атомом Гідрогену, тому його валентність дорівнює I."
    },
    {
        question: "Які фізичні властивості характерні для хлору за кімнатної температури?",
        answers: [
            "Безбарвний газ без запаху",
            "Жовто-зелений газ із різким запахом",
            "Червоно-бура рідина",
            "Сріблястий твердий метал"
        ],
        correct: 1,
        explanation: "Хлор за звичайних умов — жовто-зелений газ із різким задушливим запахом. Він токсичний."
    },
    {
        question: "Як змінюється густина хлору порівняно з повітрям за однакових умов?",
        answers: [
            "Хлор значно легший за повітря",
            "Хлор має таку саму густину, як повітря",
            "Хлор важчий за повітря",
            "Хлор не має густини"
        ],
        correct: 2,
        explanation: "Хлор має молярну масу приблизно 71 г/моль, тоді як середня молярна маса повітря — близько 29 г/моль. Тому хлор важчий за повітря."
    },
    {
        question: "Що утворюється під час взаємодії хлору з воднем на світлі?",
        answers: [
            "Вода",
            "Хлороводень HCl",
            "Амоніак NH₃",
            "Вуглекислий газ CO₂"
        ],
        correct: 1,
        explanation: "Хлор реагує з воднем з утворенням хлороводню: H₂ + Cl₂ → 2HCl. На світлі реакція може відбуватися дуже бурхливо."
    },
    {
        question: "Що утворюється під час реакції хлору з натрієм?",
        answers: [
            "Натрій хлорид NaCl",
            "Натрій оксид Na₂O",
            "Натрій гідроксид NaOH",
            "Водень H₂"
        ],
        correct: 0,
        explanation: "Натрій реагує з хлором з утворенням натрій хлориду: 2Na + Cl₂ → 2NaCl."
    },
    {
        question: "Чи має проста речовина хлор відомі алотропні модифікації?",
        answers: [
            "Так, алмаз і графіт",
            "Так, білий і червоний хлор",
            "Ні, для простої речовини хлору характерна молекулярна форма Cl₂",
            "Так, ромбічний і моноклінний хлор"
        ],
        correct: 2,
        explanation: "Для простої речовини хлору за звичайних умов характерна молекулярна форма Cl₂. Відомих алотропних модифікацій, як у Карбону чи Фосфору, він не має."
    },
    {
        question: "Де використовують сполуки Хлору в повсякденному житті?",
        answers: [
            "Для знезараження води та виробництва ПВХ",
            "Для виготовлення золота",
            "Для виробництва кисню в повітрі",
            "Для виготовлення цукру"
        ],
        correct: 0,
        explanation: "Сполуки Хлору використовують для знезараження питної та басейнової води. Також Хлор є складовою полівінілхлориду (ПВХ), з якого виготовляють труби, кабелі та інші вироби."
    }
];

let current = 0;
let score = 0;
let userAnswers = [];

function showQuestion() {
    const q = questions[current];

    document.getElementById("counter").textContent =
        `Питання ${current + 1} із ${questions.length}`;

    document.getElementById("progress").style.width =
        `${(current / questions.length) * 100}%`;

    document.getElementById("question").textContent = q.question;

    const answers = document.getElementById("answers");
    answers.innerHTML = "";

    q.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = String.fromCharCode(65 + index) + ") " + answer;
        button.onclick = () => checkAnswer(index, button);
        answers.appendChild(button);
    });

    document.getElementById("feedback").className = "feedback";
    document.getElementById("feedback").textContent = "";
    document.getElementById("next").classList.add("hidden");
}

function checkAnswer(index, button) {
    const q = questions[current];
    const buttons = document.querySelectorAll(".answer");

    buttons.forEach(b => b.disabled = true);
    userAnswers[current] = index;

    const feedback = document.getElementById("feedback");

    if (index === q.correct) {
        score++;
        button.classList.add("correct");
        feedback.className = "feedback good";
        feedback.innerHTML = "✅ Правильно!<br>" + q.explanation;
    } else {
        button.classList.add("wrong");
        buttons[q.correct].classList.add("correct");
        feedback.className = "feedback bad";
        feedback.innerHTML =
            "❌ Неправильно!<br>" +
            "Правильна відповідь: " + q.answers[q.correct] +
            "<br>" + q.explanation;
    }

    document.getElementById("next").classList.remove("hidden");
    document.getElementById("next").textContent =
        current === questions.length - 1
        ? "Показати результат"
        : "Наступне питання";
}

function nextQuestion() {
    current++;

    if (current < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").classList.add("hidden");

    const result = document.getElementById("result");
    result.classList.remove("hidden");

    let review = "";

    if (score === questions.length) {
        review = "<p>🏆 Ідеальний результат! Ти відповів правильно на всі питання!</p>";
    } else {
        review = "<div class='review'><h3>Розбір відповідей:</h3>";

        questions.forEach((q, index) => {
            const chosen = userAnswers[index];

            review += `
                <div class="review-item">
                    <b>${index + 1}. ${q.question}</b><br>
                    Твоя відповідь: ${q.answers[chosen]}<br>
                    ${chosen === q.correct
                        ? "✅ Правильно!"
                        : "❌ Правильна відповідь: " + q.answers[q.correct]}
                    <br><small>${q.explanation}</small>
                </div>
            `;
        });

        review += "</div>";
    }

    result.innerHTML = `
        <h2>🎉 Експрес кейс завершено!</h2>
        <h1>${score} із ${questions.length}</h1>
        <p>
            ${score === questions.length
                ? "Чудовий результат!"
                : score >= 8
                ? "Відмінна робота!"
                : score >= 6
                ? "Молодець! Є що повторити."
                : "Не засмучуйся! Повтори матеріал і спробуй ще раз."}
        </p>
        ${review}
        <button class="main-btn"
        onclick="location.href='https://rooms.xyz/kontavri/cl2'">
            ↩ Повернутися в кімнату
        </button>
    `;
}

showQuestion();
</script>
</body>
</html>
