
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Експрес кейс — Йод (I)</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #170d24, #352044, #171020);
    color: white;
}

.card {
    width: 100%;
    max-width: 650px;
    padding: 35px;
    border-radius: 22px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.17);
    box-shadow: 0 15px 50px rgba(0,0,0,0.4);
}

h1 {
    text-align: center;
    margin-top: 0;
    color: #d9a6ff;
}

.progress {
    text-align: center;
    color: #c9b5d9;
    margin-bottom: 25px;
}

.question {
    font-size: 20px;
    line-height: 1.5;
    margin-bottom: 25px;
}

.answers {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.answer {
    padding: 15px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 16px;
    text-align: left;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover:not(:disabled) {
    background: rgba(190,120,255,0.25);
    border-color: #c98cff;
}

.answer:disabled {
    cursor: default;
    opacity: 0.9;
}

.correct {
    background: rgba(40,170,90,0.3) !important;
    border-color: #45d483 !important;
}

.incorrect {
    background: rgba(200,50,50,0.3) !important;
    border-color: #ff6666 !important;
}

.feedback {
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    line-height: 1.5;
    display: none;
    background: rgba(255,255,255,0.1);
}

.next, .return {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.next {
    background: #a85cdb;
    color: white;
    display: none;
}

.next:hover {
    background: #bd7bea;
}

.result {
    text-align: center;
    display: none;
}

.result h2 {
    color: #d9a6ff;
    font-size: 28px;
}

.wrong-list {
    text-align: left;
    line-height: 1.6;
    margin-top: 20px;
}

.review-item {
    background: rgba(255,255,255,0.08);
    padding: 14px;
    border-radius: 12px;
    margin-top: 12px;
}

.return {
    background: #d9a6ff;
    color: #21112c;
}

.return:hover {
    background: #e7c8ff;
}
</style>
</head>
<body>

<div class="card">
    <div id="quiz">
        <h1>⚗️ Експрес кейс: Йод (I)</h1>
        <div class="progress" id="progress">Питання 1 із 10</div>
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next" id="next" onclick="nextQuestion()">Наступне питання →</button>
    </div>

    <div class="result" id="result">
        <h1>🏆 Експрес кейс завершено!</h1>
        <h2 id="score"></h2>
        <p id="resultText"></p>
        <div class="wrong-list" id="wrongList"></div>
        <button class="return" onclick="location.href='https://rooms.xyz/kontavri/i2'">
            ← Повернутися в кімнату
        </button>
    </div>
</div>

<script>
const questions = [

    // 1. ЕЛЕКТРОННА КОНФІГУРАЦІЯ — ОРИГІНАЛЬНЕ ПИТАННЯ
    {
        question: "Темно-фіолетові кристали, здатні сублімувати (переходити з твердого стану одразу в газоподібний), критично важливі для роботи щитоподібної залози (Z = 53). Яка електронна конфігурація відповідає атому Йоду?",
        answers: [
            "[Kr] 4d¹⁰ 5s² 5p⁵",
            "[Kr] 4d¹⁰ 5s² 5p⁴",
            "[Kr] 4d¹⁰ 5s² 5p⁶",
            "[Kr] 4d¹⁰ 5s² 5p³"
        ],
        correct: 0,
        explanation: "Правильно! Йод має порядковий номер 53, тобто його нейтральний атом містить 53 електрони. Його електронна конфігурація — [Kr] 4d¹⁰ 5s² 5p⁵."
    },

    // 2. СТУПІНЬ ОКИСНЕННЯ
    {
        question: "Який ступінь окиснення має Йод у сполуці KI (калій йодид)?",
        answers: [
            "+1",
            "−1",
            "+5",
            "0"
        ],
        correct: 1,
        explanation: "У калій йодиді Йод має ступінь окиснення −1, оскільки Калій має +1."
    },

    // 3. СТУПІНЬ ОКИСНЕННЯ
    {
        question: "Який ступінь окиснення має Йод у сполуці HIO₃ (йодатна кислота)?",
        answers: [
            "+1",
            "+3",
            "+5",
            "−1"
        ],
        correct: 2,
        explanation: "У HIO₃ Гідроген має +1, а три атоми Оксигену разом −6. Тому Йод має ступінь окиснення +5."
    },

    // 4. ВАЛЕНТНІСТЬ
    {
        question: "Яку валентність має Йод у сполуці HI (йодоводень)?",
        answers: [
            "I",
            "II",
            "III",
            "IV"
        ],
        correct: 0,
        explanation: "У сполуці HI Йод одновалентний, оскільки утворює один хімічний зв'язок із Гідрогеном."
    },

    // 5. ФІЗИЧНІ ВЛАСТИВОСТІ
    {
        question: "Які фізичні властивості характерні для простої речовини Йоду за звичайних умов?",
        answers: [
            "Безбарвний газ",
            "Срібляста рідина",
            "Темно-сірі або чорно-фіолетові кристали з металічним блиском",
            "Біла порошкоподібна речовина"
        ],
        correct: 2,
        explanation: "Йод за звичайних умов — тверда кристалічна речовина темно-сірого кольору з металічним блиском."
    },

    // 6. ФІЗИЧНІ ВЛАСТИВОСТІ
    {
        question: "Що відбувається з Йодом під час нагрівання?",
        answers: [
            "Він перетворюється на червону рідину",
            "Він сублімує, утворюючи фіолетову пару",
            "Він перетворюється на безбарвний газ",
            "Він спалахує синім полум'ям"
        ],
        correct: 1,
        explanation: "Під час нагрівання Йод сублімує — переходить із твердого стану в газоподібний, утворюючи характерну фіолетову пару."
    },

    // 7. ХІМІЧНІ ВЛАСТИВОСТІ
    {
        question: "Яка речовина утворюється під час реакції Йоду з воднем?",
        answers: [
            "Вода",
            "Йодоводень HI",
            "Амоніак NH₃",
            "Калій йодид KI"
        ],
        correct: 1,
        explanation: "Йод реагує з воднем з утворенням йодоводню: H₂ + I₂ ⇄ 2HI. Реакція є оборотною."
    },

    // 8. ХІМІЧНІ ВЛАСТИВОСТІ
    {
        question: "Що утворюється під час взаємодії Йоду з металом Калієм?",
        answers: [
            "Калій оксид",
            "Калій хлорид",
            "Калій йодид",
            "Калій сульфат"
        ],
        correct: 2,
        explanation: "Йод реагує з Калієм з утворенням калій йодиду: 2K + I₂ → 2KI."
    },

    // 9. АЛОТРОПІЯ
    {
        question: "Чи має Йод поширені алотропні модифікації в межах шкільного курсу хімії?",
        answers: [
            "Так, алмаз і графіт",
            "Так, білий і червоний Йод",
            "Ні, його проста речовина — молекулярний йод I₂",
            "Так, ромбічний і моноклінний Йод"
        ],
        correct: 2,
        explanation: "У шкільному курсі просту речовину Йод розглядають як молекулярну речовину I₂. Поширених алотропних модифікацій, як у Карбону, він не має."
    },

    // 10. ЗАСТОСУВАННЯ
    {
        question: "Де використовують сполуки Йоду в повсякденному житті?",
        answers: [
            "Для зміцнення зубної емалі у зубних пастах",
            "Для йодування кухонної солі та в антисептичних засобах",
            "Для виробництва звичайного кисню",
            "Для виготовлення кухонного цукру"
        ],
        correct: 1,
        explanation: "Сполуки Йоду додають до кухонної солі для профілактики йододефіциту. Також йод і його сполуки використовують в антисептичних засобах."
    }

];

let current = 0;
let score = 0;
let wrongAnswers = [];

function showQuestion() {
    const q = questions[current];

    document.getElementById("progress").textContent =
        `Питання ${current + 1} із ${questions.length}`;

    document.getElementById("question").textContent = q.question;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = answer;
        button.onclick = () => checkAnswer(index, button);
        answersDiv.appendChild(button);
    });

    document.getElementById("feedback").style.display = "none";
    document.getElementById("next").style.display = "none";
}

function checkAnswer(selected, button) {
    const q = questions[current];
    const buttons = document.querySelectorAll(".answer");
    const feedback = document.getElementById("feedback");

    buttons.forEach(btn => btn.disabled = true);

    if (selected === q.correct) {
        score++;
        button.classList.add("correct");
        feedback.innerHTML = "✅ <b>Правильно! Молодець!</b><br>" + q.explanation;
    } else {
        button.classList.add("incorrect");
        buttons[q.correct].classList.add("correct");

        wrongAnswers.push({
            question: q.question,
            answer: q.answers[q.correct],
            selected: q.answers[selected]
        });

        feedback.innerHTML = "❌ <b>На жаль, неправильно.</b><br>" +
            "Правильна відповідь: <b>" + q.answers[q.correct] +
            "</b><br>" + q.explanation;
    }

    feedback.style.display = "block";
    document.getElementById("next").style.display = "block";

    if (current === questions.length - 1) {
        document.getElementById("next").textContent = "Показати результат";
    }
}

function nextQuestion() {
    current++;

    if (current < questions.length) {
        document.getElementById("next").textContent = "Наступне питання →";
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("score").textContent =
        `${score} із ${questions.length}`;

    let message = "";

    if (score === 10) {
        message = "🔥 Ідеально! Ти чудово знаєш Йод!";
    } else if (score >= 8) {
        message = "👏 Відмінний результат! Ти добре знаєш матеріал!";
    } else if (score >= 6) {
        message = "💪 Гарний результат! Ще трохи — і буде ідеально!";
    } else if (score >= 4) {
        message = "📚 Непогано! Варто ще повторити матеріал.";
    } else {
        message = "Не засмучуйся! Повтори матеріал і спробуй ще раз.";
    }

    document.getElementById("resultText").textContent = message;

    const wrongList = document.getElementById("wrongList");

    if (wrongAnswers.length === 0) {
        wrongList.innerHTML = "✅ Усі відповіді правильні!";
    } else {
        wrongList.innerHTML = "<b>Питання, у яких були помилки:</b>";

        wrongAnswers.forEach((item, index) => {
            wrongList.innerHTML += `
                <div class="review-item">
                    <b>${index + 1}. ${item.question}</b><br>
                    Твоя відповідь: ${item.selected}<br>
                    Правильна відповідь: <b>${item.answer}</b>
                </div>
            `;
        });
    }
}

showQuestion();
</script>
</body>
</html>
