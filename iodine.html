
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квест: Йод (I)</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #170d24, #352044, #171020);
    color: white;
}
.card {
    width: 100%;
    max-width: 650px;
    padding: 35px;
    border-radius: 22px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.17);
    box-shadow: 0 15px 50px rgba(0,0,0,0.4);
}
h1 {
    text-align: center;
    margin-top: 0;
    color: #d9a6ff;
}
.progress {
    text-align: center;
    color: #c9b5d9;
    margin-bottom: 25px;
}
.question {
    font-size: 20px;
    line-height: 1.5;
    margin-bottom: 25px;
}
.answers {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.answer {
    padding: 15px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 16px;
    text-align: left;
    cursor: pointer;
    transition: 0.2s;
}
.answer:hover:not(:disabled) {
    background: rgba(190,120,255,0.25);
    border-color: #c98cff;
}
.answer:disabled {
    cursor: default;
    opacity: 0.9;
}
.correct {
    background: rgba(40,170,90,0.3) !important;
    border-color: #45d483 !important;
}
.incorrect {
    background: rgba(200,50,50,0.3) !important;
    border-color: #ff6666 !important;
}
.feedback {
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    line-height: 1.5;
    display: none;
    background: rgba(255,255,255,0.1);
}
.next, .return {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}
.next {
    background: #a85cdb;
    color: white;
    display: none;
}
.next:hover {
    background: #bd7bea;
}
.result {
    text-align: center;
    display: none;
}
.result h2 {
    color: #d9a6ff;
    font-size: 28px;
}
.wrong-list {
    text-align: left;
    line-height: 1.6;
    margin-top: 20px;
}
.return {
    background: #d9a6ff;
    color: #21112c;
}
.return:hover {
    background: #e7c8ff;
}
</style>
</head>
<body>

<div class="card">
    <div id="quiz">
        <h1>⚗️ Квест: Йод (I)</h1>
        <div class="progress" id="progress">Питання 1 із 3</div>
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next" id="next" onclick="nextQuestion()">Наступне питання →</button>
    </div>

    <div class="result" id="result">
        <h1>🏆 Квест завершено!</h1>
        <h2 id="score"></h2>
        <p id="resultText"></p>
        <div class="wrong-list" id="wrongList"></div>
        <button class="return" onclick="location.href='https://rooms.xyz/kontavri/i2'">
            ← Повернутися в кімнату
        </button>
    </div>
</div>

<script>
const questions = [
    {
        question: "Темно-фіолетові кристали, здатні сублімувати (переходити з твердого стану одразу в газоподібний), критично важливі для роботи щитоподібної залози (Z = 53). Яка електронна конфігурація відповідає атому Йоду?",
        answers: [
            "[Kr] 4d¹⁰ 5s² 5p⁵",
            "[Kr] 4d¹⁰ 5s² 5p⁴",
            "[Kr] 4d¹⁰ 5s² 5p⁶",
            "[Kr] 4d¹⁰ 5s² 5p³"
        ],
        correct: 0,
        explanation: "Правильно! Йод має порядковий номер 53, тобто його нейтральний атом містить 53 електрони. Його електронна конфігурація — [Kr] 4d¹⁰ 5s² 5p⁵."
    },
    {
        question: "Яка формула простої речовини Йоду за звичайних умов?",
        answers: [
            "I",
            "I₂",
            "IO₂",
            "I₃"
        ],
        correct: 1,
        explanation: "Правильно! Проста речовина Йод складається з двоатомних молекул. Тому її формула — I₂."
    },
    {
        question: "Як змінюється забарвлення розчину крохмалю під час взаємодії з йодом? Цю реакцію використовують для виявлення крохмалю.",
        answers: [
            "Стає червоним",
            "Стає зеленим",
            "Стає темно-синім",
            "Залишається безбарвним"
        ],
        correct: 2,
        explanation: "Молодець! Йод утворює з крохмалем комплекс, який надає суміші темно-синього, майже синьо-чорного забарвлення. Це якісна реакція на крохмаль."
    }
];

let current = 0;
let score = 0;
let wrongAnswers = [];

function showQuestion() {
    const q = questions[current];

    document.getElementById("progress").textContent =
        `Питання ${current + 1} із ${questions.length}`;

    document.getElementById("question").textContent = q.question;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = answer;
        button.onclick = () => checkAnswer(index, button);
        answersDiv.appendChild(button);
    });

    document.getElementById("feedback").style.display = "none";
    document.getElementById("next").style.display = "none";
}

function checkAnswer(selected, button) {
    const q = questions[current];
    const buttons = document.querySelectorAll(".answer");
    const feedback = document.getElementById("feedback");

    buttons.forEach(btn => btn.disabled = true);

    if (selected === q.correct) {
        score++;
        button.classList.add("correct");
        feedback.innerHTML = "✅ <b>Правильно! Молодець!</b><br>" + q.explanation;
    } else {
        button.classList.add("incorrect");
        buttons[q.correct].classList.add("correct");

        wrongAnswers.push({
            question: q.question,
            answer: q.answers[q.correct],
            selected: q.answers[selected]
        });

        feedback.innerHTML = "❌ <b>На жаль, неправильно.</b><br>" +
            "Правильна відповідь: <b>" + q.answers[q.correct] +
            "</b><br>" + q.explanation;
    }

    feedback.style.display = "block";
    document.getElementById("next").style.display = "block";

    if (current === questions.length - 1) {
        document.getElementById("next").textContent = "Показати результат";
    }
}

function nextQuestion() {
    current++;

    if (current < questions.length) {
        document.getElementById("next").textContent = "Наступне питання →";
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("score").textContent =
        `${score} із ${questions.length}`;

    let message = "";

    if (score === 3) {
        message = "🔥 Ідеально! Ти чудово знаєш Йод!";
    } else if (score === 2) {
        message = "👏 Гарний результат! Ще трохи — і буде ідеально!";
    } else if (score === 1) {
        message = "💪 Непогано! Варто ще повторити матеріал.";
    } else {
        message = "📚 Не засмучуйся! Спробуй повторити квест ще раз.";
    }

    document.getElementById("resultText").textContent = message;

    const wrongList = document.getElementById("wrongList");

    if (wrongAnswers.length === 0) {
        wrongList.innerHTML = "✅ Усі відповіді правильні!";
    } else {
        wrongList.innerHTML = "<b>Питання, у яких були помилки:</b>";

        wrongAnswers.forEach((item, index) => {
            wrongList.innerHTML += `
                <p>
                    <b>${index + 1}. ${item.question}</b><br>
                    Твоя відповідь: ${item.selected}<br>
                    Правильна відповідь: <b>${item.answer}</b>
                </p>
            `;
        });
    }
}

showQuestion();
</script>

</body>
</html>
