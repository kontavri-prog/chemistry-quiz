
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Експрес кейс — Бром (Br)</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #32100d, #68251e, #9b4936);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 650px;
    background: rgba(35, 10, 8, 0.9);
    border: 1px solid rgba(255, 170, 130, 0.3);
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.4);
}

h1 {
    text-align: center;
    color: #ffb08b;
    margin-top: 0;
}

.subtitle {
    text-align: center;
    color: #f2c5b0;
    margin-bottom: 25px;
}

.progress {
    text-align: center;
    color: #ffc09d;
    margin-bottom: 15px;
}

.progress-bar {
    height: 7px;
    background: #54231d;
    border-radius: 10px;
    margin-bottom: 15px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 10%;
    background: #ffb08b;
    transition: width .3s;
}

.question {
    font-size: 21px;
    line-height: 1.5;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    width: 100%;
    padding: 15px;
    border: 1px solid #a65340;
    border-radius: 12px;
    background: #59251e;
    color: white;
    font-size: 17px;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
}

.answer:hover:not(:disabled) {
    background: #81382c;
    transform: translateY(-2px);
}

.answer:disabled { cursor: default; }

.correct {
    background: #176b45 !important;
    border-color: #35d68b;
}

.wrong {
    background: #812f3b !important;
    border-color: #ff7180;
}

.feedback {
    min-height: 30px;
    margin-top: 20px;
    font-size: 16px;
    line-height: 1.5;
    text-align: center;
    font-weight: bold;
}

.next {
    display: none;
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #bd563b;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.next:hover { background: #e27654; }

.result {
    display: none;
    text-align: center;
}

.score {
    font-size: 34px;
    color: #ffb08b;
    margin: 20px 0;
    font-weight: bold;
}

.review {
    text-align: left;
    line-height: 1.7;
    margin: 20px 0;
}

.review-item {
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 12px;
    background: rgba(255,255,255,.07);
}

.good-text { color: #55e6a0; }
.bad-text { color: #ff8792; }

.room {
    display: block;
    text-align: center;
    margin-top: 25px;
    padding: 15px;
    border-radius: 12px;
    background: #bd563b;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.room:hover { background: #e27654; }
</style>
</head>

<body>
<div class="container">

    <div id="quiz">
        <h1>🧪 Експрес кейс: Бром (Br)</h1>
        <p class="subtitle">Перевір свої знання про неметали!</p>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="progress" id="progress">Питання 1 із 10</div>
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>

        <button class="next" id="next" onclick="nextQuestion()">
            Наступне питання →
        </button>
    </div>

    <div class="result" id="result">
        <h1>🎉 Експрес кейс завершено!</h1>
        <p>Твій результат:</p>
        <div class="score" id="score"></div>
        <div id="resultMessage"></div>
        <div class="review" id="review"></div>

        <a class="room" href="https://rooms.xyz/kontavri/b2">
            ← Повернутися в кімнату
        </a>
    </div>

</div>

<script>
const questions = [

    // 1. ЕЛЕКТРОННА КОНФІГУРАЦІЯ — ОРИГІНАЛ
    {
        question: "Питання (STEM): Один із двох хімічних елементів, які за стандартних умов є рідинами, — Бром. Це важка червоно-бура рідина з різким запахом (Z = 35). Яка електронна конфігурація відповідає його нейтральному атому?",
        answers: [
            "[Ar] 3d¹⁰ 4s² 4p⁵",
            "[Ar] 3d¹⁰ 4s² 4p⁴",
            "[Ar] 3d¹⁰ 4s² 4p⁶",
            "[Ar] 3d¹⁰ 4s² 4p³"
        ],
        correct: 0,
        explanation: "Бром має 35 електронів. Конфігурація [Ar] 3d¹⁰ 4s² 4p⁵ містить 18 + 10 + 2 + 5 = 35 електронів."
    },

    // 2. СТУПІНЬ ОКИСНЕННЯ
    {
        question: "Який ступінь окиснення має Бром у сполуці KBr?",
        answers: [
            "+1",
            "−1",
            "+5",
            "0"
        ],
        correct: 1,
        explanation: "Калій має ступінь окиснення +1, тому Бром у KBr має −1."
    },

    // 3. СТУПІНЬ ОКИСНЕННЯ
    {
        question: "Який ступінь окиснення має Бром у броматній кислоті HBrO₃?",
        answers: [
            "−1",
            "+1",
            "+3",
            "+5"
        ],
        correct: 3,
        explanation: "Розрахунок: +1 + x + 3 · (−2) = 0. Отже, ступінь окиснення Брому дорівнює +5."
    },

    // 4. ВАЛЕНТНІСТЬ
    {
        question: "Яку валентність має Бром у сполуці HBr?",
        answers: [
            "I",
            "II",
            "III",
            "VII"
        ],
        correct: 0,
        explanation: "У HBr Бром утворює один хімічний зв'язок з Гідрогеном, тому його валентність — I."
    },

    // 5. ФІЗИЧНІ ВЛАСТИВОСТІ
    {
        question: "Який вигляд має проста речовина бром за звичайних умов?",
        answers: [
            "Жовтий твердий кристал",
            "Безбарвний газ",
            "Червоно-бура рідина",
            "Сріблястий метал"
        ],
        correct: 2,
        explanation: "Бром за звичайних умов — важка червоно-бура рідина з різким неприємним запахом."
    },

    // 6. ФІЗИЧНІ ВЛАСТИВОСТІ
    {
        question: "Що відбувається з бромом під час нагрівання до температури кипіння?",
        answers: [
            "Він перетворюється на червоно-бурий газ",
            "Він стає білим порошком",
            "Він перетворюється на метал",
            "Він розкладається на Гідроген і Оксиген"
        ],
        correct: 0,
        explanation: "Бром кипить приблизно за 59 °C і переходить у червоно-буру пару. Пари Брому токсичні."
    },

    // 7. ХІМІЧНІ ВЛАСТИВОСТІ
    {
        question: "Яка сполука утворюється під час взаємодії Брому з алюмінієм?",
        answers: [
            "AlBr",
            "AlBr₂",
            "AlBr₃",
            "Al₂Br"
        ],
        correct: 2,
        explanation: "Алюміній реагує з бромом з утворенням алюміній броміду: 2Al + 3Br₂ → 2AlBr₃."
    },

    // 8. ХІМІЧНІ ВЛАСТИВОСТІ
    {
        question: "Яка речовина утворюється під час реакції Брому з воднем?",
        answers: [
            "HBr",
            "HBrO",
            "H₂O",
            "BrO₂"
        ],
        correct: 0,
        explanation: "Під час взаємодії водню з бромом утворюється бромоводень: H₂ + Br₂ → 2HBr."
    },

    // 9. АЛОТРОПІЯ
    {
        question: "Яка молекулярна формула простої речовини Брому?",
        answers: [
            "Br",
            "Br₂",
            "Br₃",
            "Br₈"
        ],
        correct: 1,
        explanation: "Проста речовина бром складається з двоатомних молекул Br₂. Для Брому в шкільному курсі алотропні модифікації не виділяють."
    },

    // 10. ЗАСТОСУВАННЯ
    {
        question: "Де використовують сполуки Брому?",
        answers: [
            "У виробництві деяких світлочутливих фотоматеріалів",
            "Для виготовлення кухонної солі",
            "Для виробництва кисню",
            "Як основний компонент питної води"
        ],
        correct: 0,
        explanation: "Бромід срібла AgBr використовували у фотоматеріалах, оскільки він чутливий до світла."
    }

];

let currentQuestion = 0;
let score = 0;
let userAnswers = [];

function showQuestion() {
    const q = questions[currentQuestion];

    document.getElementById("progress").textContent =
        `Питання ${currentQuestion + 1} із ${questions.length}`;

    document.getElementById("progressFill").style.width =
        `${((currentQuestion + 1) / questions.length) * 100}%`;

    document.getElementById("question").textContent = q.question;
    document.getElementById("feedback").textContent = "";
    document.getElementById("feedback").style.color = "white";
    document.getElementById("next").style.display = "none";

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = answer;
        button.onclick = () => checkAnswer(index, button);
        answersDiv.appendChild(button);
    });
}

function checkAnswer(selected, selectedButton) {
    const q = questions[currentQuestion];
    const buttons = document.querySelectorAll(".answer");

    buttons.forEach(button => button.disabled = true);
    userAnswers[currentQuestion] = selected;

    const feedback = document.getElementById("feedback");

    if (selected === q.correct) {
        score++;
        selectedButton.classList.add("correct");

        feedback.textContent = "✓ Молодець! " + q.explanation;
        feedback.style.color = "#55e6a0";
    } else {
        selectedButton.classList.add("wrong");
        buttons[q.correct].classList.add("correct");

        feedback.textContent =
            "✗ Неправильно! Правильна відповідь: " +
            q.answers[q.correct] + ". " + q.explanation;

        feedback.style.color = "#ff8792";
    }

    const nextButton = document.getElementById("next");

    nextButton.textContent =
        currentQuestion === questions.length - 1
        ? "Показати результат"
        : "Наступне питання →";

    nextButton.style.display = "block";
}

function nextQuestion() {
    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("score").textContent =
        `${score} із ${questions.length}`;

    let message;

    if (score === 10) {
        message = "🏆 Ідеально! Ти справжній знавець хімії!";
    } else if (score >= 8) {
        message = "🔥 Відмінний результат! Так тримати!";
    } else if (score >= 6) {
        message = "👏 Гарна робота! Ти добре знаєш матеріал.";
    } else if (score >= 4) {
        message = "💪 Непогано! Є що повторити.";
    } else {
        message = "📚 Не засмучуйся! Повтори матеріал і спробуй ще раз.";
    }

    document.getElementById("resultMessage").textContent = message;

    const review = document.getElementById("review");

    if (score === 10) {
        review.innerHTML =
            "<h3>Чудова робота! Усі відповіді правильні! 🎉</h3>";
    } else {
        review.innerHTML = "<h3>Розбір усіх відповідей:</h3>";

        questions.forEach((q, index) => {
            const correct = userAnswers[index] === q.correct;

            review.innerHTML += `
                <div class="review-item">
                    <b>${index + 1}. ${q.question}</b><br><br>
                    Твоя відповідь:
                    <span class="${correct ? "good-text" : "bad-text"}">
                        ${q.answers[userAnswers[index]]}
                    </span><br>
                    ${correct
                        ? '<span class="good-text">✓ Правильно!</span>'
                        : '<span class="bad-text">✗ Правильна відповідь: ' +
                          q.answers[q.correct] + '</span>'}
                    <br><br>${q.explanation}
                </div>
            `;
        });
    }
}

showQuestion();
</script>
</body>
</html>
