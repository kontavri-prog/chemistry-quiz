
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Експрес кейс — Флуор (F)</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #07152f, #102f59, #164b75);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 650px;
    background: rgba(5, 15, 35, 0.88);
    border: 1px solid rgba(120, 190, 255, 0.3);
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.4);
}

h1 {
    text-align: center;
    color: #75caff;
    margin-top: 0;
}

.subtitle {
    text-align: center;
    color: #b9d9f5;
    margin-bottom: 25px;
}

.progress {
    text-align: center;
    color: #8fcfff;
    margin-bottom: 15px;
}

.question {
    font-size: 21px;
    line-height: 1.5;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    width: 100%;
    padding: 15px;
    border: 1px solid #3979a9;
    border-radius: 12px;
    background: #12365d;
    color: white;
    font-size: 17px;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
}

.answer:hover:not(:disabled) {
    background: #1c5486;
    transform: translateY(-2px);
}

.answer:disabled { cursor: default; }

.correct {
    background: #176b45 !important;
    border-color: #35d68b;
}

.wrong {
    background: #812f3b !important;
    border-color: #ff7180;
}

.feedback {
    min-height: 30px;
    margin-top: 20px;
    font-size: 17px;
    text-align: left;
    line-height: 1.5;
    font-weight: bold;
}

.next {
    display: none;
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #168bd0;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.next:hover { background: #27a8f2; }

.result {
    display: none;
    text-align: center;
}

.score {
    font-size: 34px;
    color: #75caff;
    margin: 20px 0;
}

.review {
    text-align: left;
    line-height: 1.7;
    margin: 20px 0;
}

.review-item {
    padding: 14px;
    margin-bottom: 12px;
    background: rgba(255,255,255,.07);
    border-radius: 12px;
}

.room {
    display: block;
    text-align: center;
    margin-top: 25px;
    padding: 15px;
    border-radius: 12px;
    background: #168bd0;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.room:hover { background: #27a8f2; }
</style>
</head>

<body>
<div class="container">

    <div id="quiz">
        <h1>🧪 Флуор (F)</h1>
        <p class="subtitle">ЕКСПРЕС КЕЙС</p>

        <div class="progress" id="progress"></div>
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>

        <button class="next" id="next" onclick="nextQuestion()">
            Наступне питання →
        </button>
    </div>

    <div class="result" id="result">
        <h1>Експрес кейс завершено!</h1>
        <p>Твій результат:</p>

        <div class="score" id="score"></div>
        <div class="review" id="review"></div>

        <a class="room" href="https://rooms.xyz/kontavri/f2">
            ← Повернутися в кімнату
        </a>
    </div>

</div>

<script>
const questions = [
    {
        question: "Флуор — абсолютний лідер періодичної системи за електронегативністю серед галогенів. Його порядковий номер — 9. Яка електронна формула відповідає атому Флуору?",
        answers: [
            "1s² 2s² 2p³",
            "1s² 2s² 2p⁵",
            "1s² 2s² 2p⁶"
        ],
        correct: 1,
        explanation: "Атом Флуору має 9 електронів: 2 на першому рівні та 7 на другому."
    },
    {
        question: "Який ступінь окиснення Флуор має у сполуці HF?",
        answers: [
            "+1",
            "−1",
            "+2",
            "0"
        ],
        correct: 1,
        explanation: "Флуор у сполуках завжди має ступінь окиснення −1, оскільки є найелектронегативнішим елементом."
    },
    {
        question: "Який ступінь окиснення має Флуор у простій речовині F₂?",
        answers: [
            "−1",
            "+1",
            "0",
            "+2"
        ],
        correct: 2,
        explanation: "У простих речовинах ступінь окиснення кожного атома дорівнює 0. Тому у F₂ Флуор має ступінь окиснення 0."
    },
    {
        question: "Яку валентність проявляє Флуор у сполуках?",
        answers: [
            "I",
            "II",
            "III",
            "IV"
        ],
        correct: 0,
        explanation: "Флуор у сполуках одновалентний — утворює один хімічний зв'язок."
    },
    {
        question: "Які фізичні властивості характерні для Флуору за звичайних умов?",
        answers: [
            "Безбарвна рідина",
            "Жовтуватий газ із різким запахом",
            "Сріблястий твердий метал",
            "Червона тверда речовина"
        ],
        correct: 1,
        explanation: "За звичайних умов проста речовина флуор F₂ — блідо-жовтий, дуже токсичний газ із різким запахом."
    },
    {
        question: "Якою є температура кипіння простого Флуору за нормального атмосферного тиску?",
        answers: [
            "Приблизно −188 °C",
            "Приблизно 0 °C",
            "Приблизно +100 °C",
            "Приблизно +59 °C"
        ],
        correct: 0,
        explanation: "Флуор має дуже низьку температуру кипіння — близько −188 °C, тому за кімнатної температури він є газом."
    },
    {
        question: "Що утворюється під час реакції Флуору з воднем?",
        answers: [
            "Вода",
            "Фтороводень HF",
            "Амоніак NH₃",
            "Вуглекислий газ CO₂"
        ],
        correct: 1,
        explanation: "Флуор реагує з воднем з утворенням фтороводню: H₂ + F₂ → 2HF. Реакція відбувається дуже бурхливо."
    },
    {
        question: "Як Флуор реагує з водою?",
        answers: [
            "Не реагує за жодних умов",
            "Утворює лише водень",
            "Утворює фтороводень і кисень",
            "Утворює кухонну сіль"
        ],
        correct: 2,
        explanation: "Флуор активно реагує з водою: 2F₂ + 2H₂O → 4HF + O₂."
    },
    {
        question: "Чи має проста речовина Флуор відомі алотропні модифікації?",
        answers: [
            "Так, алмаз і графіт",
            "Так, білий і червоний Флуор",
            "Ні, проста речовина Флуор існує у вигляді молекул F₂",
            "Так, ромбічний і моноклінний Флуор"
        ],
        correct: 2,
        explanation: "Для простої речовини Флуор характерні двоатомні молекули F₂. Відомих алотропних модифікацій, як у Карбону чи Фосфору, він не має."
    },
    {
        question: "Де використовують сполуки Флуору в повсякденному житті?",
        answers: [
            "У зубних пастах для захисту емалі",
            "Для виробництва кухонного цукру",
            "Для виготовлення звичайного кисню",
            "Для очищення золота від домішок"
        ],
        correct: 0,
        explanation: "Сполуки Флуору — фториди — додають до багатьох зубних паст. Вони допомагають зміцнювати зубну емаль і захищати її від карієсу."
    }
];

let currentQuestion = 0;
let score = 0;
let userAnswers = [];

function showQuestion() {
    const q = questions[currentQuestion];

    document.getElementById("progress").textContent =
        `Питання ${currentQuestion + 1} із ${questions.length}`;

    document.getElementById("question").textContent = q.question;
    document.getElementById("feedback").textContent = "";
    document.getElementById("next").style.display = "none";

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = answer;
        button.onclick = () => checkAnswer(index, button);
        answersDiv.appendChild(button);
    });
}

function checkAnswer(selected, selectedButton) {
    const q = questions[currentQuestion];
    const buttons = document.querySelectorAll(".answer");

    buttons.forEach(button => button.disabled = true);
    userAnswers[currentQuestion] = selected;

    const feedback = document.getElementById("feedback");

    if (selected === q.correct) {
        score++;
        selectedButton.classList.add("correct");

        feedback.textContent = "✓ Молодець! " + q.explanation;
        feedback.style.color = "#55e6a0";
    } else {
        selectedButton.classList.add("wrong");
        buttons[q.correct].classList.add("correct");

        feedback.textContent =
            "✗ Неправильно! " +
            "Правильна відповідь: " + q.answers[q.correct] +
            ". " + q.explanation;

        feedback.style.color = "#ff8792";
    }

    const nextButton = document.getElementById("next");

    nextButton.textContent =
        currentQuestion === questions.length - 1
        ? "Показати результат"
        : "Наступне питання →";

    nextButton.style.display = "block";
}

function nextQuestion() {
    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("score").textContent =
        `${score} із ${questions.length}`;

    const review = document.getElementById("review");

    if (score === questions.length) {
        review.innerHTML =
            "<h3>Чудова робота! Усі відповіді правильні! 🎉</h3>";
    } else {
        review.innerHTML = "<h3>Розбір відповідей:</h3>";

        questions.forEach((q, index) => {
            const chosen = userAnswers[index];

            review.innerHTML += `
                <div class="review-item">
                    <b>${index + 1}. ${q.question}</b><br>
                    Твоя відповідь: ${q.answers[chosen]}<br>
                    ${chosen === q.correct
                        ? "✅ Правильно!"
                        : "❌ Правильна відповідь: " + q.answers[q.correct]}
                    <br><small>${q.explanation}</small>
                </div>
            `;
        });
    }
}

showQuestion();
</script>
</body>
</html>
