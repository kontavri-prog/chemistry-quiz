
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Експрес кейс — Нітроген</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #07152f, #123c70, #07152f);
}

.card {
    width: 100%;
    max-width: 600px;
    padding: 30px;
    border-radius: 22px;
    background: rgba(8, 23, 48, 0.96);
    box-shadow: 0 15px 50px rgba(0,0,0,0.4);
}

h1 {
    text-align: center;
    color: #65b5ff;
    margin-top: 0;
}

.subtitle {
    text-align: center;
    color: #a9c9ed;
    margin-bottom: 25px;
}

.progress {
    text-align: center;
    color: #a9c9ed;
    margin-bottom: 20px;
}

.progress-bar {
    height: 8px;
    background: #28558a;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 15px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #65b5ff;
    transition: width 0.3s;
}

.question {
    font-size: 19px;
    line-height: 1.5;
    margin-bottom: 22px;
}

.answers {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.answer {
    padding: 15px;
    border: 2px solid #28558a;
    border-radius: 12px;
    background: #102c50;
    color: white;
    font-size: 16px;
    cursor: pointer;
    text-align: left;
    transition: 0.2s;
}

.answer:hover:not(:disabled) {
    background: #1b4779;
    border-color: #65b5ff;
}

.answer:disabled {
    cursor: default;
    opacity: 1;
}

.correct {
    background: #176b45;
    border-color: #35d68b;
}

.wrong {
    background: #782d39;
    border-color: #ff687a;
}

.feedback {
    display: none;
    margin-top: 18px;
    padding: 15px;
    border-radius: 12px;
    line-height: 1.5;
    background: #142f50;
}

.next {
    display: none;
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #438cf5;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.next:hover, .room:hover {
    background: #286dcc;
}

.result {
    display: none;
    text-align: center;
    line-height: 1.6;
}

.score {
    font-size: 32px;
    color: #65b5ff;
    font-weight: bold;
    margin: 20px;
}

.review {
    text-align: left;
    margin-top: 20px;
    padding: 15px;
    background: #102c50;
    border-radius: 12px;
}

.review-item {
    padding: 12px;
    margin-bottom: 12px;
    background: #18395f;
    border-radius: 10px;
}

.room {
    display: block;
    margin-top: 25px;
    padding: 15px;
    border-radius: 12px;
    background: #438cf5;
    color: white;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

    <div id="quiz">
        <h1>Нітроген (N)</h1>
        <div class="subtitle">🧪 ЕКСПРЕС КЕЙС</div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="progress" id="progress"></div>
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>

        <button class="next" id="next" onclick="nextQuestion()">
            Наступне питання →
        </button>
    </div>

    <div class="result" id="result">
        <h1>Експрес кейс завершено!</h1>
        <div class="score" id="score"></div>
        <p id="resultText"></p>
        <div class="review" id="review"></div>

        <a class="room" href="https://rooms.xyz/kontavri/n2">
            ← Повернутися в кімнату
        </a>
    </div>

</div>

<script>
const questions = [
    {
        question: "Атом Нітрогену має порядковий номер 7. Яка його електронна конфігурація?",
        answers: [
            "1s² 2s² 2p³",
            "1s² 2s² 2p⁴",
            "1s² 2s¹ 2p⁴",
            "1s² 2s² 2p²"
        ],
        correct: 0,
        explanation: "Молодець! Нітроген має 7 електронів: 2 на першому рівні та 5 на другому. Конфігурація — 1s² 2s² 2p³."
    },
    {
        question: "Який ступінь окиснення Нітроген має в амоніаку NH₃?",
        answers: [
            "+3",
            "−3",
            "+5",
            "0"
        ],
        correct: 1,
        explanation: "У NH₃ Гідроген має ступінь окиснення +1. Три атоми Гідрогену дають +3, тому Нітроген має −3."
    },
    {
        question: "Який ступінь окиснення Нітроген має в нітратній кислоті HNO₃?",
        answers: [
            "−3",
            "+3",
            "+5",
            "−1"
        ],
        correct: 2,
        explanation: "У HNO₃ Гідроген має +1, а Оксиген −2. Тому Нітроген має ступінь окиснення +5."
    },
    {
        question: "Яку валентність найчастіше проявляє Нітроген у амоніаку NH₃?",
        answers: [
            "I",
            "II",
            "III",
            "IV"
        ],
        correct: 2,
        explanation: "В амоніаку атом Нітрогену утворює три хімічні зв'язки з атомами Гідрогену, тому його валентність дорівнює III."
    },
    {
        question: "Які фізичні властивості має азот за звичайних умов?",
        answers: [
            "Безбарвний газ без запаху",
            "Жовта тверда речовина",
            "Синя рідина",
            "Червоний газ із різким запахом"
        ],
        correct: 0,
        explanation: "Азот N₂ — безбарвний газ без запаху, який становить приблизно 78% об'єму сухого повітря."
    },
    {
        question: "Яка властивість рідкого азоту робить його корисним для охолодження?",
        answers: [
            "Він має дуже високу температуру кипіння",
            "Він має дуже низьку температуру кипіння — близько −196 °C",
            "Він швидко перетворюється на метал",
            "Він добре горить"
        ],
        correct: 1,
        explanation: "Рідкий азот кипить приблизно за −196 °C, тому його використовують для сильного охолодження та заморожування."
    },
    {
        question: "Що утворюється під час реакції азоту з воднем за відповідних умов?",
        answers: [
            "Вода H₂O",
            "Амоніак NH₃",
            "Вуглекислий газ CO₂",
            "Сірководень H₂S"
        ],
        correct: 1,
        explanation: "Азот реагує з воднем з утворенням амоніаку: N₂ + 3H₂ ⇄ 2NH₃. Реакція відбувається за високої температури, тиску та за наявності каталізатора."
    },
    {
        question: "Який газ може утворюватися під час реакції Нітрогену з киснем за дуже високої температури?",
        answers: [
            "NO — нітроген(II) оксид",
            "CO₂ — вуглекислий газ",
            "NH₃ — амоніак",
            "H₂ — водень"
        ],
        correct: 0,
        explanation: "За дуже високої температури азот реагує з киснем з утворенням NO: N₂ + O₂ → 2NO. Такий процес може відбуватися, наприклад, під час грози."
    },
    {
        question: "Які дві основні форми має проста речовина Нітроген у звичайних умовах і за особливих умов?",
        answers: [
            "Алмаз і графіт",
            "Ромбічна та моноклінна",
            "Молекулярний азот N₂ та полімерний азот",
            "Білий і червоний фосфор"
        ],
        correct: 2,
        explanation: "Найпоширеніша форма простої речовини Нітрогену — молекулярний азот N₂. За надзвичайно високого тиску можуть утворюватися полімерні форми азоту."
    },
    {
        question: "Де широко використовують азот завдяки його низькій хімічній активності?",
        answers: [
            "Для наповнення упаковок продуктів, щоб уповільнити їх псування",
            "Для підтримки горіння в печах",
            "Для виробництва кисню",
            "Як основне паливо для автомобілів"
        ],
        correct: 0,
        explanation: "Азот використовують у харчовій промисловості для створення захисного середовища в упаковках. Він витісняє кисень і допомагає довше зберігати продукти."
    }
];

let current = 0;
let score = 0;
let userAnswers = [];

function showQuestion() {
    const q = questions[current];

    document.getElementById("progress").textContent =
        "Питання " + (current + 1) + " із " + questions.length;

    document.getElementById("progressFill").style.width =
        (current / questions.length * 100) + "%";

    document.getElementById("question").textContent = q.question;

    const answers = document.getElementById("answers");
    answers.innerHTML = "";

    q.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = String.fromCharCode(65 + index) + ") " + answer;
        button.onclick = () => selectAnswer(index);
        answers.appendChild(button);
    });

    document.getElementById("feedback").style.display = "none";
    document.getElementById("next").style.display = "none";
}

function selectAnswer(index) {
    const q = questions[current];
    const buttons = document.querySelectorAll(".answer");

    buttons.forEach(button => button.disabled = true);

    userAnswers[current] = index;

    const feedback = document.getElementById("feedback");

    if (index === q.correct) {
        score++;
        buttons[index].classList.add("correct");
        feedback.innerHTML = "✅ <b>Правильно!</b><br>" + q.explanation;
    } else {
        buttons[index].classList.add("wrong");
        buttons[q.correct].classList.add("correct");

        feedback.innerHTML =
            "❌ <b>Неправильно!</b><br>" +
            "Правильна відповідь: " + q.answers[q.correct] +
            "<br>" + q.explanation;
    }

    feedback.style.display = "block";

    const next = document.getElementById("next");
    next.style.display = "block";

    next.textContent =
        current === questions.length - 1
        ? "Показати результат"
        : "Наступне питання →";
}

function nextQuestion() {
    current++;

    if (current < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("score").textContent =
        score + " із " + questions.length;

    document.getElementById("resultText").textContent =
        score === questions.length
        ? "Ідеальний результат! Ти чудово знаєш Нітроген! 🏆"
        : score >= 8
        ? "Чудова робота! 🔥"
        : score >= 6
        ? "Молодець! 👍"
        : score >= 4
        ? "Непогано! Повтори матеріал."
        : "Не засмучуйся! Повтори матеріал і спробуй ще раз.";

    const review = document.getElementById("review");
    review.innerHTML = "<h3>Розбір відповідей:</h3>";

    questions.forEach((q, index) => {
        const chosen = userAnswers[index];

        const item = document.createElement("div");
        item.className = "review-item";

        item.innerHTML = `
            <b>${index + 1}. ${q.question}</b><br>
            Твоя відповідь: ${q.answers[chosen]}<br>
            ${chosen === q.correct
                ? "✅ Правильно!"
                : "❌ Правильна відповідь: " + q.answers[q.correct]}
            <br><small>${q.explanation}</small>
        `;

        review.appendChild(item);
    });
}

showQuestion();
</script>

</body>
</html>
