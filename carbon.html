
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Експрес кейс — Карбон</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #101a35, #243b65);
}

.card {
    width: 100%;
    max-width: 650px;
    padding: 30px;
    border-radius: 22px;
    background: #182744;
    box-shadow: 0 10px 35px rgba(0,0,0,0.35);
}

h1 { text-align: center; margin-top: 0; }

.subtitle {
    text-align: center;
    color: #a9c5f5;
    margin-bottom: 25px;
}

.progress {
    height: 8px;
    background: #344563;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #54a0ff;
    transition: width 0.3s;
}

.question {
    font-size: 20px;
    line-height: 1.5;
    margin-bottom: 22px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    width: 100%;
    padding: 15px;
    border: 2px solid #405579;
    border-radius: 12px;
    background: #243858;
    color: white;
    font-size: 16px;
    text-align: left;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover:not(:disabled) {
    background: #34517e;
    border-color: #65a5ff;
}

.answer:disabled {
    cursor: default;
    opacity: 1;
}

.correct {
    background: #17633d;
    border-color: #35d18a;
}

.wrong {
    background: #762e3a;
    border-color: #ff6878;
}

.feedback {
    margin-top: 18px;
    padding: 15px;
    border-radius: 12px;
    line-height: 1.5;
    display: none;
    background: #263d5e;
}

.next {
    display: none;
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #438cf5;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.next:hover, .return:hover { background: #2e75dc; }

.result {
    display: none;
    text-align: center;
}

.result h2 { font-size: 28px; }

.review {
    text-align: left;
    margin-top: 25px;
    line-height: 1.6;
}

.review-item {
    padding: 14px;
    margin-bottom: 12px;
    background: #243858;
    border-radius: 12px;
}

.return {
    display: block;
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #438cf5;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="card">

    <h1>⚛️ Карбон (C)</h1>
    <div class="subtitle">🧪 ЕКСПРЕС КЕЙС</div>

    <div id="quiz">
        <div class="progress">
            <div class="progress-bar" id="progress"></div>
        </div>

        <div id="counter"></div>
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>

        <div class="feedback" id="feedback"></div>

        <button class="next" id="next" onclick="nextQuestion()">
            Наступне питання
        </button>
    </div>

    <div class="result" id="result">
        <h2>🎉 Експрес кейс завершено!</h2>
        <h1 id="score"></h1>
        <p id="message"></p>

        <div class="review" id="review"></div>

        <button class="return" onclick="returnToRoom()">
            ↩ Повернутися до кімнати
        </button>
    </div>

</div>

<script>

const questions = [
    {
        question: "Основа всього земного життя та унікальних матеріалів (від алмазу до графену). Атом цього елемента має 6 електронів. Як вони розподіляються по енергетичних підрівнях?",
        answers: [
            "1s² 2s² 2p⁴",
            "1s² 2s² 2p²",
            "1s² 2s¹ 2p³",
            "1s² 2p⁴"
        ],
        correct: 1,
        explanation: "Правильно! Електронна конфігурація Карбону — 1s² 2s² 2p². Усього атом має 6 електронів."
    },
    {
        question: "Який ступінь окиснення Карбон має у вуглекислому газі CO₂?",
        answers: [
            "+2",
            "−4",
            "+4",
            "0"
        ],
        correct: 2,
        explanation: "У CO₂ кожен атом Оксигену має ступінь окиснення −2. Разом це −4, тому Карбон має +4."
    },
    {
        question: "Який ступінь окиснення Карбон має в метані CH₄?",
        answers: [
            "+4",
            "−4",
            "+2",
            "0"
        ],
        correct: 1,
        explanation: "У метані Гідроген має ступінь окиснення +1. Чотири атоми Гідрогену дають +4, тому Карбон має −4."
    },
    {
        question: "Яка валентність Карбону в більшості його сполук, наприклад у метані CH₄?",
        answers: [
            "I",
            "II",
            "III",
            "IV"
        ],
        correct: 3,
        explanation: "Карбон у метані утворює чотири хімічні зв'язки, тому його валентність дорівнює IV."
    },
    {
        question: "Яка фізична властивість характерна для алмазу?",
        answers: [
            "Він дуже м'який",
            "Він є найтвердішою природною речовиною",
            "Він добре розчиняється у воді",
            "Він є рідиною за кімнатної температури"
        ],
        correct: 1,
        explanation: "Алмаз має дуже міцну просторову структуру, тому є найтвердішою природною речовиною."
    },
    {
        question: "Яка фізична властивість відрізняє графіт від алмазу?",
        answers: [
            "Графіт добре проводить електричний струм",
            "Графіт є прозорою рідиною",
            "Графіт твердіший за алмаз",
            "Графіт легко розчиняється у воді"
        ],
        correct: 0,
        explanation: "Графіт проводить електричний струм завдяки рухомим електронам у своїй шаруватій структурі."
    },
    {
        question: "Що утворюється під час повного згоряння Карбону в достатній кількості кисню?",
        answers: [
            "Водень",
            "Вуглекислий газ CO₂",
            "Метан CH₄",
            "Амоніак NH₃"
        ],
        correct: 1,
        explanation: "Під час повного згоряння Карбон реагує з киснем і утворює вуглекислий газ: C + O₂ → CO₂."
    },
    {
        question: "Яка речовина утворюється під час неповного згоряння Карбону за нестачі кисню?",
        answers: [
            "Вуглекислий газ CO₂",
            "Вода H₂O",
            "Чадний газ CO",
            "Сірчистий газ SO₂"
        ],
        correct: 2,
        explanation: "За нестачі кисню може утворюватися чадний газ CO. Він дуже отруйний і небезпечний для людини."
    },
    {
        question: "Як називаються різні прості речовини, утворені одним хімічним елементом Карбоном, наприклад алмаз і графіт?",
        answers: [
            "Ізотопи",
            "Алотропні модифікації",
            "Іони",
            "Сплави"
        ],
        correct: 1,
        explanation: "Алмаз і графіт — алотропні модифікації Карбону. Вони складаються з атомів одного елемента, але мають різну будову та властивості."
    },
    {
        question: "Де використовують алмаз завдяки його надзвичайній твердості?",
        answers: [
            "Для виготовлення різальних і бурових інструментів",
            "Для виробництва питної води",
            "Як основний компонент бензину",
            "Для виготовлення харчової солі"
        ],
        correct: 0,
        explanation: "Завдяки надзвичайній твердості алмаз використовують у різальних, шліфувальних і бурових інструментах."
    }
];

let current = 0;
let score = 0;
let userAnswers = [];

function showQuestion() {
    const q = questions[current];

    document.getElementById("counter").textContent =
        `Питання ${current + 1} із ${questions.length}`;

    document.getElementById("progress").style.width =
        `${(current / questions.length) * 100}%`;

    document.getElementById("question").textContent = q.question;

    const answers = document.getElementById("answers");
    answers.innerHTML = "";

    q.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = `${String.fromCharCode(65 + index)}) ${answer}`;
        button.onclick = () => selectAnswer(index);
        answers.appendChild(button);
    });

    document.getElementById("feedback").style.display = "none";
    document.getElementById("next").style.display = "none";
}

function selectAnswer(index) {
    const q = questions[current];
    const buttons = document.querySelectorAll(".answer");

    buttons.forEach(button => button.disabled = true);

    userAnswers[current] = index;

    const feedback = document.getElementById("feedback");

    if (index === q.correct) {
        score++;
        buttons[index].classList.add("correct");
        feedback.innerHTML = "✅ <b>Правильно!</b><br>" + q.explanation;
    } else {
        buttons[index].classList.add("wrong");
        buttons[q.correct].classList.add("correct");

        feedback.innerHTML =
            "❌ <b>Неправильно!</b><br>" +
            "Правильна відповідь: " + q.answers[q.correct] +
            "<br>" + q.explanation;
    }

    feedback.style.display = "block";

    const next = document.getElementById("next");
    next.style.display = "block";

    next.textContent =
        current === questions.length - 1
        ? "Показати результат"
        : "Наступне питання";
}

function nextQuestion() {
    current++;

    if (current < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("score").textContent =
        `${score} із ${questions.length}`;

    document.getElementById("message").textContent =
        score === questions.length ? "Ідеальний результат! 🏆" :
        score >= 8 ? "Чудова робота! 🔥" :
        score >= 6 ? "Дуже добре! 👍" :
        score >= 4 ? "Непогано! Повтори матеріал." :
        "Не засмучуйся! Спробуй ще раз.";

    const review = document.getElementById("review");

    review.innerHTML = "<h3>Розбір відповідей:</h3>";

    questions.forEach((q, index) => {
        const chosen = userAnswers[index];

        review.innerHTML += `
            <div class="review-item">
                <b>${index + 1}. ${q.question}</b><br>
                Твоя відповідь: ${q.answers[chosen]}<br>
                ${chosen === q.correct
                    ? "✅ Правильно!"
                    : "❌ Правильна відповідь: " + q.answers[q.correct]}
                <br><small>${q.explanation}</small>
            </div>
        `;
    });
}

function returnToRoom() {
    window.location.href = "https://rooms.xyz/kontavri/c2";
}

showQuestion();

</script>

</body>
</html>
