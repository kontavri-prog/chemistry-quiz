
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Експрес кейс — Селен (Se)</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #101827, #49352b);
}

.card {
    width: 100%;
    max-width: 650px;
    padding: 35px;
    border-radius: 22px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 15px 45px rgba(0,0,0,0.35);
}

h1 { text-align: center; margin-top: 0; }

.subtitle {
    text-align: center;
    color: #e2c4a9;
    margin-bottom: 28px;
}

.progress {
    height: 8px;
    background: #493d35;
    border-radius: 10px;
    margin-bottom: 25px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 10%;
    background: #e5a45b;
    transition: width .3s;
}

.question {
    font-size: 20px;
    line-height: 1.5;
    margin-bottom: 22px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    padding: 16px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 12px;
    background: rgba(255,255,255,.07);
    color: white;
    font-size: 17px;
    text-align: left;
    cursor: pointer;
    transition: .2s;
}

.answer:hover:not(:disabled) {
    background: rgba(229,164,91,.2);
    border-color: #e5a45b;
}

.answer:disabled {
    cursor: default;
    opacity: .85;
}

.answer.correct {
    background: rgba(46,160,90,.3);
    border-color: #4ade80;
}

.answer.wrong {
    background: rgba(220,60,60,.3);
    border-color: #f87171;
}

.feedback {
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    line-height: 1.5;
    display: none;
}

.feedback.good {
    display: block;
    background: rgba(46,160,90,.2);
}

.feedback.bad {
    display: block;
    background: rgba(220,60,60,.2);
}

.main-btn {
    width: 100%;
    padding: 16px;
    margin-top: 22px;
    border: none;
    border-radius: 12px;
    background: #e5a45b;
    color: #28190d;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.main-btn:hover {
    background: #f2bb7c;
}

.result { text-align: center; }

.result h2 { font-size: 30px; }

.score {
    font-size: 34px;
    font-weight: bold;
    color: #e5a45b;
    margin: 20px 0;
}

.review {
    text-align: left;
    line-height: 1.6;
    margin-top: 20px;
}

.review-item {
    padding: 14px;
    margin-bottom: 12px;
    background: rgba(255,255,255,.07);
    border-radius: 12px;
}

.hidden { display: none; }

.good-text { color: #4ade80; }
.bad-text { color: #f87171; }
</style>
</head>

<body>

<div class="card">
    <div id="quiz">
        <h1>🧪 Селен (Se)</h1>
        <div class="subtitle">ЕКСПРЕС КЕЙС</div>

        <div class="progress">
            <div class="progress-bar" id="progress"></div>
        </div>

        <div id="counter" class="subtitle">
            Питання 1 із 10
        </div>

        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>

        <button class="main-btn hidden" id="next" onclick="nextQuestion()">
            Наступне питання →
        </button>
    </div>

    <div id="result" class="result hidden"></div>
</div>

<script>
const questions = [

    // 1. ЕЛЕКТРОННА КОНФІГУРАЦІЯ — ОРИГІНАЛ
    {
        question: "Питання (Олімпіадне): Селен — халькоген, що виявляє фотопровідність: його електропровідність зростає під дією світла. Він також є важливим мікроелементом і входить до складу деяких антиоксидантних ферментів. Порядковий номер Селену — 34. Яка скорочена електронна конфігурація відповідає його нейтральному атому?",

        answers: [
            "[Ar] 3d¹⁰ 4s² 4p⁴",
            "[Ar] 3d¹⁰ 4s² 4p⁶",
            "[Ar] 3d¹⁰ 4s² 4p³",
            "[Ar] 3d¹⁰ 4s² 4p⁵"
        ],

        correct: 0,

        explanation: "Правильно! Селен має 34 електрони. Позначення [Ar] відповідає 18 електронам, а 3d¹⁰ + 4s² + 4p⁴ — ще 16. Разом отримуємо 34 електрони."
    },

    // 2. СТУПІНЬ ОКИСНЕННЯ
    {
        question: "Який ступінь окиснення зазвичай має Селен у сполуці H₂Se?",

        answers: [
            "+2",
            "−2",
            "+4",
            "+6"
        ],

        correct: 1,

        explanation: "У H₂Se кожен атом Гідрогену має ступінь окиснення +1. Два атоми дають +2, тому Селен має −2."
    },

    // 3. СТУПІНЬ ОКИСНЕННЯ
    {
        question: "Який ступінь окиснення має Селен у селеновій кислоті H₂SeO₄?",

        answers: [
            "−2",
            "+2",
            "+4",
            "+6"
        ],

        correct: 3,

        explanation: "У H₂SeO₄ Гідроген дає +2, а Оксиген — −8. Щоб сума дорівнювала нулю, Селен має ступінь окиснення +6."
    },

    // 4. ВАЛЕНТНІСТЬ
    {
        question: "Яку валентність має Селен у сполуці H₂Se?",

        answers: [
            "I",
            "II",
            "IV",
            "VI"
        ],

        correct: 1,

        explanation: "У H₂Se атом Селену утворює два хімічні зв'язки з атомами Гідрогену. Тому його валентність — II."
    },

    // 5. ФІЗИЧНІ ВЛАСТИВОСТІ
    {
        question: "Який колір має найвідоміша кристалічна алотропна модифікація Селену?",

        answers: [
            "Сірий із металічним блиском",
            "Яскраво-зелений",
            "Білий прозорий",
            "Синій"
        ],

        correct: 0,

        explanation: "Сірий Селен має темно-сірий колір із металічним блиском. Саме ця модифікація є найстабільнішою за звичайних умов."
    },

    // 6. ФІЗИЧНІ ВЛАСТИВОСТІ
    {
        question: "Яка незвичайна фізична властивість характерна для сірого Селену?",

        answers: [
            "Він стає рідким під дією магніту",
            "Його електропровідність зростає під дією світла",
            "Він проводить електричний струм лише у воді",
            "Він світиться в темряві без джерела енергії"
        ],

        correct: 1,

        explanation: "Сірий Селен має фотопровідність: під дією світла його електропровідність збільшується. Цю властивість використовували у світлочутливих приладах."
    },

    // 7. ХІМІЧНІ ВЛАСТИВОСТІ
    {
        question: "Яка речовина утворюється під час горіння Селену в кисні?",

        answers: [
            "Селеноводень H₂Se",
            "Селен(IV) оксид SeO₂",
            "Селенова кислота H₂SeO₄",
            "Вода H₂O"
        ],

        correct: 1,

        explanation: "Під час горіння Селен реагує з киснем і утворює селен(IV) оксид: Se + O₂ → SeO₂."
    },

    // 8. ХІМІЧНІ ВЛАСТИВОСТІ
    {
        question: "Яка речовина утворюється під час взаємодії Селену з воднем?",

        answers: [
            "Селеноводень H₂Se",
            "Селен(IV) оксид SeO₂",
            "Селенова кислота H₂SeO₄",
            "Сірководень H₂S"
        ],

        correct: 0,

        explanation: "Під час нагрівання Селен може реагувати з воднем з утворенням селеноводню: H₂ + Se → H₂Se."
    },

    // 9. АЛОТРОПІЯ
    {
        question: "Які алотропні модифікації характерні для Селену?",

        answers: [
            "Білий і чорний",
            "Червоний і сірий",
            "Жовтий і зелений",
            "Ромбічний і моноклінний"
        ],

        correct: 1,

        explanation: "Найвідоміші алотропні модифікації Селену — червоний і сірий. Вони відрізняються будовою та фізичними властивостями."
    },

    // 10. ЗАСТОСУВАННЯ
    {
        question: "Де використовують Селен завдяки його здатності змінювати електропровідність під дією світла?",

        answers: [
            "У світлочутливих приладах і фотоелементах",
            "Для виробництва кухонної солі",
            "Для очищення питної води від бактерій",
            "Для виготовлення звичайного цукру"
        ],

        correct: 0,

        explanation: "Завдяки фотопровідності Селен використовували у фотоелементах та інших світлочутливих приладах."
    }

];

let current = 0;
let score = 0;
let userAnswers = [];

function showQuestion() {

    const q = questions[current];

    document.getElementById("counter").textContent =
        `Питання ${current + 1} із ${questions.length}`;

    document.getElementById("progress").style.width =
        `${((current + 1) / questions.length) * 100}%`;

    document.getElementById("question").textContent = q.question;

    const answers = document.getElementById("answers");
    answers.innerHTML = "";

    q.answers.forEach((answer, index) => {

        const button = document.createElement("button");

        button.className = "answer";
        button.textContent =
            String.fromCharCode(65 + index) + ". " + answer;

        button.onclick = () => checkAnswer(index, button);

        answers.appendChild(button);

    });

    document.getElementById("feedback").className = "feedback";
    document.getElementById("feedback").textContent = "";

    document.getElementById("next").classList.add("hidden");
    document.getElementById("next").textContent = "Наступне питання →";
}

function checkAnswer(index, button) {

    const q = questions[current];
    const buttons = document.querySelectorAll(".answer");
    const feedback = document.getElementById("feedback");

    buttons.forEach(b => b.disabled = true);

    userAnswers[current] = index;

    if (index === q.correct) {

        score++;

        button.classList.add("correct");

        feedback.className = "feedback good";
        feedback.textContent = "✅ Правильно! " + q.explanation;

    } else {

        button.classList.add("wrong");
        buttons[q.correct].classList.add("correct");

        feedback.className = "feedback bad";
        feedback.textContent =
            "❌ Неправильно. Правильна відповідь: " +
            q.answers[q.correct] + ". " + q.explanation;

    }

    const next = document.getElementById("next");

    next.classList.remove("hidden");

    next.textContent =
        current === questions.length - 1
        ? "Показати результат →"
        : "Наступне питання →";
}

function nextQuestion() {

    current++;

    if (current < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {

    document.getElementById("quiz").classList.add("hidden");

    const result = document.getElementById("result");
    result.classList.remove("hidden");

    let message = "";

    if (score === 10) {
        message = "🔥 Ідеально! Ти чудово знаєш Селен!";
    } else if (score >= 8) {
        message = "👏 Відмінний результат! Ти добре знаєш матеріал!";
    } else if (score >= 6) {
        message = "💪 Гарний результат! Ще трохи — і буде ідеально!";
    } else if (score >= 4) {
        message = "📚 Непогано! Варто ще повторити матеріал.";
    } else {
        message = "Не засмучуйся! Повтори матеріал і спробуй ще раз.";
    }

    let review = "";

    if (score === 10) {
        review = "<p>🏆 Ідеальний результат! Усі відповіді правильні!</p>";
    } else {

        review = `<h3>${message}</h3><h3>Розбір усіх відповідей:</h3>`;

        questions.forEach((q, index) => {

            const correct = userAnswers[index] === q.correct;

            review += `
                <div class="review-item">
                    <b>${index + 1}. ${q.question}</b><br><br>

                    Твоя відповідь:
                    <span class="${correct ? "good-text" : "bad-text"}">
                        ${q.answers[userAnswers[index]]}
                    </span><br>

                    ${correct
                        ? '<span class="good-text">✓ Правильно!</span>'
                        : '<span class="bad-text">✗ Правильна відповідь: ' +
                          q.answers[q.correct] + '</span>'}

                    <br><br>${q.explanation}
                </div>
            `;

        });

    }

    result.innerHTML = `
        <h2>🎉 Експрес кейс завершено!</h2>
        <div class="score">${score} із ${questions.length}</div>
        <p>${message}</p>
        ${review}

        <button class="main-btn"
        onclick="location.href='https://rooms.xyz/kontavri/se2'">
            ← Повернутися в кімнату
        </button>
    `;
}

showQuestion();

</script>

</body>
</html>
