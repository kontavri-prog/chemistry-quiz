
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Експрес кейс — Гідроген</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #10172e, #203b64);
  color: white;
  padding: 20px;
}

.quiz {
  width: 100%;
  max-width: 570px;
  background: #182642;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 15px 50px #0007;
}

.tag {
  text-align: center;
  color: #69d9ff;
  letter-spacing: 2px;
  margin-bottom: 15px;
}

h1 {
  text-align: center;
  font-size: 27px;
}

.progress {
  text-align: center;
  color: #a9c5e8;
  margin: 20px 0;
}

.question {
  font-size: 19px;
  line-height: 1.5;
  margin-bottom: 20px;
}

.answers {
  display: grid;
  gap: 12px;
}

button {
  padding: 15px;
  border: 2px solid #456080;
  border-radius: 12px;
  background: #253a5c;
  color: white;
  font-size: 17px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover:not(:disabled) {
  background: #345783;
  border-color: #69d9ff;
}

button:disabled {
  cursor: default;
  opacity: 0.9;
}

.correct {
  border-color: #62e69a;
  background: #20543f;
}

.wrong {
  border-color: #ff8585;
  background: #632e39;
}

#feedback {
  margin-top: 18px;
  line-height: 1.5;
  text-align: center;
  font-size: 16px;
}

#next, #return {
  display: none;
  width: 100%;
  margin-top: 20px;
  background: #176c91;
  border-color: #69d9ff;
}

#resultScreen {
  display: none;
}

.score {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  color: #69d9ff;
  margin: 25px 0;
}

.review {
  background: #253a5c;
  border-radius: 12px;
  padding: 15px;
  margin-top: 12px;
  line-height: 1.5;
}

.good { color: #62e69a; }
.bad { color: #ff8585; }
</style>
</head>

<body>

<div class="quiz">

  <div class="tag">🧪 ЕКСПРЕС КЕЙС</div>

  <div id="quizScreen">
    <h1>Гідроген H</h1>

    <div class="progress" id="progress">
      Питання 1 із 10
    </div>

    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div id="feedback"></div>

    <button id="next" onclick="nextQuestion()">
      Наступне питання →
    </button>
  </div>

  <div id="resultScreen">
    <h1>Результати експрес кейсу!</h1>
    <div class="score" id="score"></div>
    <div id="review"></div>

    <button id="return" onclick="returnToRoom()">
      ← Повернутися до кімнати
    </button>
  </div>

</div>

<script>

// ПИТАННЯ ВІКТОРИНИ

const questions = [

  {
    question: "Цей елемент є основним паливом зір. Його атом має лише один електрон. Яка його електронна формула?",
    options: ["1s¹", "1s²", "2s¹", "2s²"],
    correct: 0,
    explanation: "Гідроген має один електрон, який перебуває на першому енергетичному рівні. Його формула — 1s¹."
  },

  {
    question: "Який ступінь окиснення найчастіше має Гідроген у сполуках з неметалами, наприклад у воді H₂O?",
    options: ["−1", "0", "+1", "+2"],
    correct: 2,
    explanation: "У більшості сполук із неметалами Гідроген має ступінь окиснення +1."
  },

  {
    question: "Який ступінь окиснення має Гідроген у сполуці NaH (натрій гідрид)?",
    options: ["+1", "−1", "0", "+2"],
    correct: 1,
    explanation: "У сполуках із металами Гідроген може мати ступінь окиснення −1. NaH — приклад такої сполуки."
  },

  {
    question: "Яка валентність Гідрогену в більшості його сполук?",
    options: ["I", "II", "III", "IV"],
    correct: 0,
    explanation: "Гідроген одновалентний: його атом утворює один хімічний зв'язок."
  },

  {
    question: "Якими є фізичні властивості водню за звичайних умов?",
    options: [
      "Безбарвний газ без запаху",
      "Жовта рідина із запахом",
      "Тверда речовина сріблястого кольору",
      "Зелений газ із різким запахом"
    ],
    correct: 0,
    explanation: "Водень H₂ за звичайних умов — безбарвний газ без запаху."
  },

  {
    question: "Яка фізична властивість найкраще відрізняє водень від більшості інших газів?",
    options: [
      "Він має найбільшу густину",
      "Він є найменш густим газом",
      "Він має синій колір",
      "Він легко перетворюється на тверду речовину"
    ],
    correct: 1,
    explanation: "Водень — найлегший газ. Його густина значно менша за густину повітря."
  },

  {
    question: "Що утворюється під час реакції водню з киснем?",
    options: [
      "Вуглекислий газ",
      "Амоніак",
      "Вода",
      "Хлороводень"
    ],
    correct: 2,
    explanation: "Під час реакції водню з киснем утворюється вода: 2H₂ + O₂ → 2H₂O."
  },

  {
    question: "За яких умов водень реагує з хлором з утворенням хлороводню?",
    options: [
      "Під дією світла",
      "Лише за температури −200 °C",
      "Під час розчинення у воді",
      "Без будь-яких умов і миттєво"
    ],
    correct: 0,
    explanation: "Водень реагує з хлором під дією світла: H₂ + Cl₂ → 2HCl."
  },

  {
    question: "Чи має проста речовина водень алотропні модифікації?",
    options: [
      "Так, графіт і алмаз",
      "Так, білий і червоний фосфор",
      "Ні, не має",
      "Так, ромбічну та моноклінну"
    ],
    correct: 2,
    explanation: "Водень не має алотропних модифікацій. Його проста речовина за звичайних умов існує у вигляді молекул H₂."
  },

  {
    question: "Де широко використовують водень у хімічній промисловості?",
    options: [
      "Для виробництва амоніаку",
      "Для виготовлення кухонної солі",
      "Для виробництва кисню",
      "Для отримання вуглекислого газу"
    ],
    correct: 0,
    explanation: "Водень використовують для виробництва амоніаку (NH₃), який є важливою сировиною для виготовлення добрив."
  }

];

// ЗМІННІ

let currentQuestion = 0;
let score = 0;
let userAnswers = [];

// ПОКАЗ ПИТАННЯ

function showQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("progress").textContent =
    `Питання ${currentQuestion + 1} із ${questions.length}`;

  document.getElementById("question").textContent = q.question;
  document.getElementById("feedback").textContent = "";
  document.getElementById("next").style.display = "none";
  document.getElementById("next").textContent = "Наступне питання →";

  const answers = document.getElementById("answers");
  answers.innerHTML = "";

  q.options.forEach((option, index) => {

    const button = document.createElement("button");

    button.textContent =
      String.fromCharCode(65 + index) + ". " + option;

    button.onclick = () => selectAnswer(index);

    answers.appendChild(button);

  });

}

// ВИБІР ВІДПОВІДІ

function selectAnswer(index) {

  const q = questions[currentQuestion];
  const buttons = document.querySelectorAll("#answers button");

  buttons.forEach(button => button.disabled = true);

  const isCorrect = index === q.correct;
  userAnswers.push(index);

  if (isCorrect) {

    score++;
    buttons[index].classList.add("correct");

    document.getElementById("feedback").innerHTML =
      "✅ Правильно! " + q.explanation;

  } else {

    buttons[index].classList.add("wrong");
    buttons[q.correct].classList.add("correct");

    document.getElementById("feedback").innerHTML =
      "❌ Неправильно! " + q.explanation;

  }

  document.getElementById("next").style.display = "block";

  if (currentQuestion === questions.length - 1) {
    document.getElementById("next").textContent =
      "Показати результат →";
  }

}

// НАСТУПНЕ ПИТАННЯ

function nextQuestion() {

  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showResults();
  }

}

// РЕЗУЛЬТАТИ

function showResults() {

  document.getElementById("quizScreen").style.display = "none";
  document.getElementById("resultScreen").style.display = "block";

  document.getElementById("score").textContent =
    `${score} із ${questions.length} правильних`;

  const review = document.getElementById("review");
  review.innerHTML = "";

  questions.forEach((q, index) => {

    const correct = userAnswers[index] === q.correct;
    const item = document.createElement("div");

    item.className = "review";

    item.innerHTML = `
      <strong class="${correct ? "good" : "bad"}">
        ${correct ? "✓ Правильно" : "✗ Помилка"}
      </strong>
      <p>${index + 1}. ${q.question}</p>
      <p>Твоя відповідь: ${q.options[userAnswers[index]]}</p>
      ${!correct ? `<p>Правильна відповідь: ${q.options[q.correct]}</p>` : ""}
      <p>${q.explanation}</p>
    `;

    review.appendChild(item);

  });

  document.getElementById("return").style.display = "block";

}

// ПОВЕРНЕННЯ ДО КІМНАТИ

function returnToRoom() {
  window.location.href = "https://rooms.xyz/kontavri/h2";
}

// ЗАПУСК

showQuestion();

</script>

</body>
</html>
