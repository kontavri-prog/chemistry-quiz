
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Експрес кейс — Йод (I)</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #10172e, #203b64);
  color: white;
  padding: 20px;
}

.quiz {
  width: 100%;
  max-width: 570px;
  background: #182642;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 15px 50px #0007;
}

.tag {
  text-align: center;
  color: #69d9ff;
  letter-spacing: 2px;
  margin-bottom: 15px;
}

h1 {
  text-align: center;
  font-size: 27px;
}

.progress {
  text-align: center;
  color: #a9c5e8;
  margin: 20px 0;
}

.question {
  font-size: 19px;
  line-height: 1.5;
  margin-bottom: 20px;
}

.answers {
  display: grid;
  gap: 12px;
}

button {
  padding: 15px;
  border: 2px solid #456080;
  border-radius: 12px;
  background: #253a5c;
  color: white;
  font-size: 17px;
  cursor: pointer;
  transition: 0.2s;
  text-align: left;
}

button:hover:not(:disabled) {
  background: #345783;
  border-color: #69d9ff;
}

button:disabled {
  cursor: default;
  opacity: 0.9;
}

.correct {
  border-color: #62e69a;
  background: #20543f;
}

.wrong {
  border-color: #ff8585;
  background: #632e39;
}

#feedback {
  margin-top: 18px;
  line-height: 1.5;
  text-align: left;
  font-size: 16px;
}

#next, #return {
  display: none;
  width: 100%;
  margin-top: 20px;
  background: #176c91;
  border-color: #69d9ff;
  text-align: center;
}

#resultScreen {
  display: none;
}

.score {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  color: #69d9ff;
  margin: 25px 0;
}

.review {
  background: #253a5c;
  border-radius: 12px;
  padding: 15px;
  margin-top: 12px;
  line-height: 1.5;
}

.good { color: #62e69a; }
.bad { color: #ff8585; }
</style>
</head>

<body>

<div class="quiz">

  <div class="tag">🧪 ЕКСПРЕС КЕЙС</div>

  <div id="quizScreen">
    <h1>Йод I</h1>

    <div class="progress" id="progress">
      Питання 1 із 10
    </div>

    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div id="feedback"></div>

    <button id="next" onclick="nextQuestion()">
      Наступне питання →
    </button>
  </div>

  <div id="resultScreen">
    <h1>Результати експрес кейсу!</h1>
    <div class="score" id="score"></div>
    <div id="review"></div>

    <button id="return" onclick="returnToRoom()">
      ← Повернутися до кімнати
    </button>
  </div>

</div>

<script>

// ПИТАННЯ ВІКТОРИНИ

const questions = [

  {
    question: "Цей елемент є основним паливом зір. Його атом має лише один електрон. Яка його електронна формула?",
    options: ["1s¹", "1s²", "2s¹", "2s²"],
    correct: 0,
    explanation: "Гідроген має один електрон, який перебуває на першому енергетичному рівні. Його формула — 1s¹."
  },

  {
    question: "Який ступінь окиснення має Йод у сполуці KI (калій йодид)?",
    options: ["+1", "−1", "0", "+5"],
    correct: 1,
    explanation: "У калій йодиді Йод має ступінь окиснення −1, оскільки Калій має +1."
  },

  {
    question: "Який ступінь окиснення має Йод у йодатній кислоті HIO₃?",
    options: ["−1", "+1", "+3", "+5"],
    correct: 3,
    explanation: "У HIO₃ Гідроген має +1, три атоми Оксигену разом −6. Тому Йод має ступінь окиснення +5."
  },

  {
    question: "Яку валентність найчастіше проявляє Йод у сполуках, наприклад у HI?",
    options: ["I", "II", "III", "IV"],
    correct: 0,
    explanation: "У сполуці HI Йод одновалентний, оскільки утворює один хімічний зв'язок із Гідрогеном."
  },

  {
    question: "Які фізичні властивості характерні для простої речовини Йоду за звичайних умов?",
    options: [
      "Безбарвний газ",
      "Срібляста рідина",
      "Темно-сірі або чорно-фіолетові кристали з металічним блиском",
      "Біла порошкоподібна речовина"
    ],
    correct: 2,
    explanation: "Йод за звичайних умов — тверда кристалічна речовина темно-сірого кольору з металічним блиском."
  },

  {
    question: "Що відбувається з Йодом під час нагрівання?",
    options: [
      "Він перетворюється на червону рідину",
      "Він сублімує, утворюючи фіолетову пару",
      "Він перетворюється на безбарвний газ",
      "Він спалахує синім полум'ям"
    ],
    correct: 1,
    explanation: "Під час нагрівання Йод сублімує — переходить із твердого стану в газоподібний, утворюючи характерну фіолетову пару."
  },

  {
    question: "Яка речовина утворюється під час реакції Йоду з воднем?",
    options: [
      "Вода",
      "Йодоводень HI",
      "Амоніак NH₃",
      "Калій йодид KI"
    ],
    correct: 1,
    explanation: "Йод реагує з воднем з утворенням йодоводню: H₂ + I₂ ⇄ 2HI. Реакція є оборотною."
  },

  {
    question: "Що утворюється під час взаємодії Йоду з металом Калієм?",
    options: [
      "Калій оксид",
      "Калій хлорид",
      "Калій йодид",
      "Калій сульфат"
    ],
    correct: 2,
    explanation: "Йод реагує з Калієм з утворенням калій йодиду: 2K + I₂ → 2KI."
  },

  {
    question: "Чи має Йод алотропні модифікації за звичайних шкільних умов?",
    options: [
      "Так, алмаз і графіт",
      "Так, білий і червоний Йод",
      "Ні, його проста речовина — молекулярний йод I₂",
      "Так, ромбічний і моноклінний Йод"
    ],
    correct: 2,
    explanation: "У шкільному курсі просту речовину Йод розглядають як молекулярну речовину I₂. Відомих поширених алотропних модифікацій, як у Карбону, він не має."
  },

  {
    question: "Де використовують сполуки Йоду в повсякденному житті?",
    options: [
      "Для зміцнення зубної емалі у зубних пастах",
      "Для йодування кухонної солі та в антисептичних засобах",
      "Для виробництва звичайного кисню",
      "Для виготовлення кухонного цукру"
    ],
    correct: 1,
    explanation: "Сполуки Йоду додають до кухонної солі для профілактики йододефіциту. Також йод і його сполуки використовують в антисептичних засобах."
  }

];

// ЗМІННІ

let currentQuestion = 0;
let score = 0;
let userAnswers = [];

// ПОКАЗ ПИТАННЯ

function showQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("progress").textContent =
    `Питання ${currentQuestion + 1} із ${questions.length}`;

  document.getElementById("question").textContent = q.question;
  document.getElementById("feedback").textContent = "";
  document.getElementById("next").style.display = "none";
  document.getElementById("next").textContent = "Наступне питання →";

  const answers = document.getElementById("answers");
  answers.innerHTML = "";

  q.options.forEach((option, index) => {

    const button = document.createElement("button");

    button.textContent =
      String.fromCharCode(65 + index) + ". " + option;

    button.onclick = () => selectAnswer(index);

    answers.appendChild(button);

  });

}

// ВИБІР ВІДПОВІДІ

function selectAnswer(index) {

  const q = questions[currentQuestion];
  const buttons = document.querySelectorAll("#answers button");

  buttons.forEach(button => button.disabled = true);

  const isCorrect = index === q.correct;
  userAnswers.push(index);

  if (isCorrect) {

    score++;
    buttons[index].classList.add("correct");

    document.getElementById("feedback").innerHTML =
      "✅ Правильно! " + q.explanation;

    document.getElementById("feedback").style.color = "#62e69a";

  } else {

    buttons[index].classList.add("wrong");
    buttons[q.correct].classList.add("correct");

    document.getElementById("feedback").innerHTML =
      "❌ Неправильно! " + q.explanation;

    document.getElementById("feedback").style.color = "#ff8585";

  }

  document.getElementById("next").style.display = "block";

  if (currentQuestion === questions.length - 1) {
    document.getElementById("next").textContent =
      "Показати результат →";
  }

}

// НАСТУПНЕ ПИТАННЯ

function nextQuestion() {

  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showResults();
  }

}

// РЕЗУЛЬТАТИ

function showResults() {

  document.getElementById("quizScreen").style.display = "none";
  document.getElementById("resultScreen").style.display = "block";

  document.getElementById("score").textContent =
    `${score} із ${questions.length} правильних`;

  const review = document.getElementById("review");
  review.innerHTML = "";

  questions.forEach((q, index) => {

    const correct = userAnswers[index] === q.correct;
    const item = document.createElement("div");

    item.className = "review";

    item.innerHTML = `
      <strong class="${correct ? "good" : "bad"}">
        ${correct ? "✓ Правильно" : "✗ Помилка"}
      </strong>
      <p>${index + 1}. ${q.question}</p>
      <p>Твоя відповідь: ${q.options[userAnswers[index]]}</p>
      ${!correct ? `<p>Правильна відповідь: ${q.options[q.correct]}</p>` : ""}
      <p>${q.explanation}</p>
    `;

    review.appendChild(item);

  });

  document.getElementById("return").style.display = "block";

}

// ПОВЕРНЕННЯ ДО КІМНАТИ

function returnToRoom() {
  window.location.href = "https://rooms.xyz/kontavri/i2";
}

// ЗАПУСК

showQuestion();

</script>

</body>
</html>
