
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Експрес кейс — Фосфор (P)</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #07152f, #102f59, #164b75);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 650px;
    background: rgba(5, 15, 35, 0.88);
    border: 1px solid rgba(120, 190, 255, 0.3);
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.4);
}

h1 {
    text-align: center;
    color: #75caff;
    margin-top: 0;
}

.subtitle {
    text-align: center;
    color: #b9d9f5;
    margin-bottom: 25px;
}

.progress {
    text-align: center;
    color: #8fcfff;
    margin-bottom: 15px;
}

.question {
    font-size: 21px;
    line-height: 1.5;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    width: 100%;
    padding: 15px;
    border: 1px solid #3979a9;
    border-radius: 12px;
    background: #12365d;
    color: white;
    font-size: 17px;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
}

.answer:hover:not(:disabled) {
    background: #1c5486;
    transform: translateY(-2px);
}

.answer:disabled { cursor: default; }

.correct {
    background: #176b45 !important;
    border-color: #35d68b;
}

.wrong {
    background: #812f3b !important;
    border-color: #ff7180;
}

.feedback {
    min-height: 30px;
    margin-top: 20px;
    font-size: 17px;
    text-align: left;
    line-height: 1.5;
    font-weight: bold;
}

.next {
    display: none;
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #168bd0;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.next:hover { background: #27a8f2; }

.result {
    display: none;
    text-align: center;
}

.score {
    font-size: 34px;
    color: #75caff;
    margin: 20px 0;
}

.review {
    text-align: left;
    line-height: 1.7;
    margin: 20px 0;
}

.review-item {
    padding: 14px;
    margin-bottom: 12px;
    background: rgba(255,255,255,.07);
    border-radius: 12px;
}

.room {
    display: block;
    text-align: center;
    margin-top: 25px;
    padding: 15px;
    border-radius: 12px;
    background: #168bd0;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.room:hover { background: #27a8f2; }
</style>
</head>

<body>
<div class="container">

    <div id="quiz">
        <h1>⚗️ Фосфор (P)</h1>
        <p class="subtitle">ЕКСПРЕС КЕЙС</p>

        <div class="progress" id="progress"></div>
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>

        <button class="next" id="next" onclick="nextQuestion()">
            Наступне питання →
        </button>
    </div>

    <div class="result" id="result">
        <h1>🏆 Експрес кейс завершено!</h1>
        <p>Твій результат:</p>

        <div class="score" id="score"></div>
        <div class="review" id="review"></div>

        <a class="room" href="https://rooms.xyz/kontavri/p2">
            ← Повернутися в кімнату
        </a>
    </div>

</div>

<script>
const questions = [

    // 1. ЕЛЕКТРОННА КОНФІГУРАЦІЯ — ОРИГІНАЛ
    {
        question: "«Енергетична валюта» клітини (АТФ) та ДНК обов'язково містять біогенний елемент із порядковим номером 15. Як його електрони розміщуються на енергетичних підрівнях?",
        answers: [
            "1s² 2s² 2p⁶ 3s² 3p¹",
            "1s² 2s² 2p⁶ 3s² 3p³",
            "1s² 2s² 2p⁶ 3s² 3p⁵"
        ],
        correct: 1,
        explanation: "Правильно! Фосфор має 15 електронів: 2 + 2 + 6 + 2 + 3 = 15."
    },

    // 2. СТУПІНЬ ОКИСНЕННЯ
    {
        question: "Який ступінь окиснення має Фосфор у сполуці PH₃ (фосфін)?",
        answers: [
            "+3",
            "−3",
            "+5",
            "0"
        ],
        correct: 1,
        explanation: "У PH₃ Гідроген має ступінь окиснення +1. Три атоми Гідрогену разом дають +3, тому Фосфор має −3."
    },

    // 3. СТУПІНЬ ОКИСНЕННЯ
    {
        question: "Який ступінь окиснення має Фосфор у фосфатній кислоті H₃PO₄?",
        answers: [
            "−3",
            "+1",
            "+3",
            "+5"
        ],
        correct: 3,
        explanation: "У H₃PO₄ три атоми Гідрогену мають сумарно +3, чотири атоми Оксигену — −8. Отже, Фосфор має +5."
    },

    // 4. ВАЛЕНТНІСТЬ
    {
        question: "Яку валентність має Фосфор у сполуці PH₃?",
        answers: [
            "I",
            "II",
            "III",
            "V"
        ],
        correct: 2,
        explanation: "У PH₃ атом Фосфору утворює три хімічні зв'язки з атомами Гідрогену, тому його валентність — III."
    },

    // 5. ФІЗИЧНІ ВЛАСТИВОСТІ
    {
        question: "Які фізичні властивості характерні для білого фосфору?",
        answers: [
            "Біла або жовтувата м'яка воскова речовина",
            "Чорний твердий метал",
            "Безбарвний газ",
            "Червона прозора рідина"
        ],
        correct: 0,
        explanation: "Білий фосфор — м'яка воскова речовина білого або жовтуватого кольору. Він дуже отруйний і може самозайматися на повітрі."
    },

    // 6. ФІЗИЧНІ ВЛАСТИВОСТІ
    {
        question: "Яка властивість характерна для червоного фосфору порівняно з білим?",
        answers: [
            "Він набагато токсичніший і самозаймається на повітрі",
            "Він менш реакційноздатний і не самозаймається за звичайних умов",
            "Він є безбарвним газом",
            "Він легко розчиняється у воді"
        ],
        correct: 1,
        explanation: "Червоний фосфор менш реакційноздатний і значно безпечніший за білий. За звичайних умов він не самозаймається на повітрі."
    },

    // 7. ХІМІЧНІ ВЛАСТИВОСТІ
    {
        question: "Яка речовина утворюється під час горіння Фосфору в надлишку кисню?",
        answers: [
            "Фосфін PH₃",
            "Фосфор(V) оксид P₄O₁₀",
            "Фосфатна кислота H₃PO₄",
            "Вода H₂O"
        ],
        correct: 1,
        explanation: "Під час горіння Фосфору в надлишку кисню утворюється фосфор(V) оксид: P₄ + 5O₂ → P₄O₁₀."
    },

    // 8. ХІМІЧНІ ВЛАСТИВОСТІ
    {
        question: "Яка речовина утворюється під час реакції Фосфору з хлором за надлишку хлору?",
        answers: [
            "Фосфор трихлорид PCl₃",
            "Фосфор пентахлорид PCl₅",
            "Хлороводень HCl",
            "Фосфатна кислота H₃PO₄"
        ],
        correct: 1,
        explanation: "За надлишку хлору Фосфор утворює фосфор пентахлорид: 2P + 5Cl₂ → 2PCl₅."
    },

    // 9. АЛОТРОПІЯ
    {
        question: "Які основні алотропні модифікації Фосфору вивчають у шкільному курсі хімії?",
        answers: [
            "Алмаз і графіт",
            "Білий, червоний і чорний фосфор",
            "Ромбічна та моноклінна сірка",
            "Озон і кисень"
        ],
        correct: 1,
        explanation: "Основні алотропні модифікації Фосфору — білий, червоний і чорний фосфор. Вони відрізняються будовою та властивостями."
    },

    // 10. ЗАСТОСУВАННЯ
    {
        question: "Де широко використовують сполуки Фосфору?",
        answers: [
            "Для виробництва мінеральних добрив",
            "Для виготовлення кухонного цукру",
            "Для виробництва кисню",
            "Для очищення питної води від солей"
        ],
        correct: 0,
        explanation: "Фосфатні сполуки широко використовують у виробництві мінеральних добрив, необхідних для росту рослин."
    }

];

let currentQuestion = 0;
let score = 0;
let userAnswers = [];

function showQuestion() {
    const q = questions[currentQuestion];

    document.getElementById("progress").textContent =
        `Питання ${currentQuestion + 1} із ${questions.length}`;

    document.getElementById("question").textContent = q.question;
    document.getElementById("feedback").textContent = "";
    document.getElementById("next").style.display = "none";
    document.getElementById("next").textContent = "Наступне питання →";

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = String.fromCharCode(65 + index) + ". " + answer;
        button.onclick = () => checkAnswer(index, button);
        answersDiv.appendChild(button);
    });
}

function checkAnswer(selected, selectedButton) {
    const q = questions[currentQuestion];
    const buttons = document.querySelectorAll(".answer");

    buttons.forEach(button => button.disabled = true);
    userAnswers[currentQuestion] = selected;

    if (selected === q.correct) {
        score++;
        selectedButton.classList.add("correct");

        document.getElementById("feedback").textContent =
            "✓ Молодець! " + q.explanation;

        document.getElementById("feedback").style.color = "#55e6a0";
    } else {
        selectedButton.classList.add("wrong");
        buttons[q.correct].classList.add("correct");

        document.getElementById("feedback").textContent =
            "✗ Неправильно! " +
            "Правильна відповідь: " + q.answers[q.correct] +
            ". " + q.explanation;

        document.getElementById("feedback").style.color = "#ff8792";
    }

    const nextButton = document.getElementById("next");

    nextButton.textContent =
        currentQuestion === questions.length - 1
        ? "Показати результат"
        : "Наступне питання →";

    nextButton.style.display = "block";
}

function nextQuestion() {
    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("score").textContent =
        `${score} із ${questions.length}`;

    const review = document.getElementById("review");

    let message = "";

    if (score === 10) {
        message = "🔥 Ідеально! Ти чудово знаєш Фосфор!";
    } else if (score >= 8) {
        message = "👏 Відмінний результат! Ти добре знаєш матеріал!";
    } else if (score >= 6) {
        message = "💪 Гарний результат! Ще трохи — і буде ідеально!";
    } else if (score >= 4) {
        message = "📚 Непогано! Варто ще повторити матеріал.";
    } else {
        message = "Не засмучуйся! Повтори матеріал і спробуй ще раз.";
    }

    if (userAnswers.every((answer, index) => answer === questions[index].correct)) {
        review.innerHTML = "<h3>Чудова робота! Усі відповіді правильні! 🎉</h3>";
    } else {
        review.innerHTML = `<h3>${message}</h3><h3>Розбір відповідей:</h3>`;

        questions.forEach((q, index) => {
            const correct = userAnswers[index] === q.correct;

            review.innerHTML += `
                <div class="review-item">
                    <b>${index + 1}. ${q.question}</b><br>
                    Твоя відповідь: ${q.answers[userAnswers[index]]}<br>
                    ${correct
                        ? '<span style="color:#55e6a0">✓ Правильно!</span>'
                        : '<span style="color:#ff8792">✗ Правильна відповідь: ' + q.answers[q.correct] + '</span>'}
                    <br>${q.explanation}
                </div>
            `;
        });
    }
}

showQuestion();
</script>
</body>
</html>
