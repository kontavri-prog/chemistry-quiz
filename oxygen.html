
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Експрес кейс — Оксиген</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #07152f, #102f59, #164b75);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 650px;
    background: rgba(5, 15, 35, 0.88);
    border: 1px solid rgba(120, 190, 255, 0.3);
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
}

h1 {
    text-align: center;
    color: #75caff;
    margin-top: 0;
}

.subtitle {
    text-align: center;
    color: #b9d9f5;
    margin-bottom: 25px;
}

.progress {
    text-align: center;
    color: #8fcfff;
    margin-bottom: 15px;
}

.progress-bar {
    height: 8px;
    background: #244b70;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 15px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #75caff;
    transition: width 0.3s;
}

.question {
    font-size: 21px;
    line-height: 1.5;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    width: 100%;
    padding: 15px;
    border: 1px solid #3979a9;
    border-radius: 12px;
    background: #12365d;
    color: white;
    font-size: 17px;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
}

.answer:hover:not(:disabled) {
    background: #1c5486;
    transform: translateY(-2px);
}

.answer:disabled {
    cursor: default;
    opacity: 1;
}

.correct {
    background: #176b45 !important;
    border-color: #35d68b;
}

.wrong {
    background: #812f3b !important;
    border-color: #ff7180;
}

.feedback {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 16px;
    background: #142f50;
}

.next {
    display: none;
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #168bd0;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.next:hover, .room:hover {
    background: #27a8f2;
}

.result {
    display: none;
    text-align: center;
}

.score {
    font-size: 34px;
    color: #75caff;
    margin: 20px 0;
}

.review {
    text-align: left;
    line-height: 1.7;
    margin: 20px 0;
}

.review-item {
    padding: 12px;
    margin-bottom: 12px;
    background: #12365d;
    border-radius: 10px;
}

.room {
    display: block;
    text-align: center;
    margin-top: 25px;
    padding: 15px;
    border-radius: 12px;
    background: #168bd0;
    color: white;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <div id="quiz">
        <h1>Оксиген (O)</h1>
        <p class="subtitle">🧪 ЕКСПРЕС КЕЙС</p>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="progress" id="progress"></div>
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>

        <button class="next" id="next" onclick="nextQuestion()">
            Наступне питання →
        </button>
    </div>

    <div class="result" id="result">
        <h1>Експрес кейс завершено!</h1>
        <p>Твій результат:</p>

        <div class="score" id="score"></div>
        <p id="resultText"></p>
        <div class="review" id="review"></div>

        <a class="room" href="https://rooms.xyz/kontavri/o2">
            ← Повернутися в кімнату
        </a>
    </div>

</div>

<script>
const questions = [
    {
        question: "Цей елемент є необхідним для аеробного дихання та підтримує процеси горіння. Його атом має 8 електронів. Яка електронна формула відповідає цьому атому?",
        answers: [
            "1s² 2s² 2p²",
            "1s² 2s² 2p⁴",
            "1s² 2s² 2p⁶"
        ],
        correct: 1,
        explanation: "Правильно! Оксиген має 8 електронів, які розподіляються так: 1s² 2s² 2p⁴."
    },
    {
        question: "Який ступінь окиснення Оксиген найчастіше має у своїх сполуках, наприклад у воді H₂O?",
        answers: [
            "+2",
            "−2",
            "−1",
            "+1"
        ],
        correct: 1,
        explanation: "У більшості сполук Оксиген має ступінь окиснення −2. У воді два атоми Гідрогену мають сумарно +2, тому Оксиген має −2."
    },
    {
        question: "Який ступінь окиснення Оксиген має в пероксиді водню H₂O₂?",
        answers: [
            "−2",
            "+2",
            "−1",
            "0"
        ],
        correct: 2,
        explanation: "У пероксидах Оксиген має ступінь окиснення −1. H₂O₂ є типовим прикладом такої сполуки."
    },
    {
        question: "Яку валентність найчастіше проявляє Оксиген у сполуках, наприклад у воді?",
        answers: [
            "I",
            "II",
            "III",
            "IV"
        ],
        correct: 1,
        explanation: "Оксиген у більшості сполук двовалентний. У молекулі води він утворює два хімічні зв'язки з атомами Гідрогену."
    },
    {
        question: "Які фізичні властивості має кисень за звичайних умов?",
        answers: [
            "Безбарвний газ без запаху",
            "Жовта тверда речовина",
            "Синя рідина",
            "Червоний газ із різким запахом"
        ],
        correct: 0,
        explanation: "Кисень O₂ за звичайних умов — безбарвний газ без запаху і смаку."
    },
    {
        question: "Якого кольору рідкий кисень?",
        answers: [
            "Червоного",
            "Зеленого",
            "Блакитного",
            "Чорного"
        ],
        correct: 2,
        explanation: "Рідкий кисень має блакитний колір. Його отримують за дуже низької температури, приблизно −183 °C."
    },
    {
        question: "Що утворюється під час реакції магнію з киснем?",
        answers: [
            "Магній оксид MgO",
            "Магній хлорид MgCl₂",
            "Водень H₂",
            "Вуглекислий газ CO₂"
        ],
        correct: 0,
        explanation: "Магній активно реагує з киснем і утворює магній оксид: 2Mg + O₂ → 2MgO."
    },
    {
        question: "Що відбувається під час взаємодії кисню з воднем?",
        answers: [
            "Утворюється амоніак",
            "Утворюється вода",
            "Утворюється кухонна сіль",
            "Утворюється вуглекислий газ"
        ],
        correct: 1,
        explanation: "Водень реагує з киснем з утворенням води: 2H₂ + O₂ → 2H₂O. Ця реакція супроводжується виділенням енергії."
    },
    {
        question: "Як називаються дві основні алотропні форми Оксигену?",
        answers: [
            "Алмаз і графіт",
            "Кисень O₂ та озон O₃",
            "Білий і червоний фосфор",
            "Ромбічна та моноклінна сірка"
        ],
        correct: 1,
        explanation: "Оксиген утворює дві алотропні форми: звичайний кисень O₂ та озон O₃. Вони мають різну кількість атомів у молекулі та різні властивості."
    },
    {
        question: "Де використовують кисень завдяки його здатності підтримувати дихання?",
        answers: [
            "У медичних кисневих балонах для допомоги пацієнтам",
            "Для виготовлення кухонної солі",
            "Як основний компонент харчового цукру",
            "Для гасіння всіх видів пожеж"
        ],
        correct: 0,
        explanation: "Кисень використовують у медицині для кисневої терапії, коли пацієнтам потрібно забезпечити додаткове надходження кисню."
    }
];

let currentQuestion = 0;
let score = 0;
let userAnswers = [];

function showQuestion() {
    const q = questions[currentQuestion];

    document.getElementById("progress").textContent =
        `Питання ${currentQuestion + 1} із ${questions.length}`;

    document.getElementById("progressFill").style.width =
        `${(currentQuestion / questions.length) * 100}%`;

    document.getElementById("question").textContent = q.question;

    document.getElementById("feedback").style.display = "none";
    document.getElementById("next").style.display = "none";

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = String.fromCharCode(65 + index) + ") " + answer;
        button.onclick = () => checkAnswer(index);

        answersDiv.appendChild(button);
    });
}

function checkAnswer(selected) {
    const q = questions[currentQuestion];
    const buttons = document.querySelectorAll(".answer");

    buttons.forEach(button => button.disabled = true);
    userAnswers[currentQuestion] = selected;

    const feedback = document.getElementById("feedback");

    if (selected === q.correct) {
        score++;
        buttons[selected].classList.add("correct");
        feedback.innerHTML = "✅ Правильно!<br>" + q.explanation;
        feedback.style.color = "#55e6a0";
    } else {
        buttons[selected].classList.add("wrong");
        buttons[q.correct].classList.add("correct");

        feedback.innerHTML =
            "❌ Неправильно!<br>" +
            "Правильна відповідь: " + q.answers[q.correct] +
            "<br>" + q.explanation;

        feedback.style.color = "#ff8792";
    }

    feedback.style.display = "block";

    const nextButton = document.getElementById("next");
    nextButton.textContent =
        currentQuestion === questions.length - 1
        ? "Показати результат"
        : "Наступне питання →";

    nextButton.style.display = "block";
}

function nextQuestion() {
    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("score").textContent =
        `${score} із ${questions.length}`;

    document.getElementById("resultText").textContent =
        score === questions.length
        ? "Ідеальний результат! 🏆"
        : score >= 8
        ? "Чудова робота! 🔥"
        : score >= 6
        ? "Молодець! 👍"
        : score >= 4
        ? "Непогано! Повтори матеріал."
        : "Не засмучуйся! Повтори матеріал і спробуй ще раз.";

    const review = document.getElementById("review");
    review.innerHTML = "<h3>Розбір відповідей:</h3>";

    questions.forEach((q, index) => {
        const chosen = userAnswers[index];

        const item = document.createElement("div");
        item.className = "review-item";

        item.innerHTML = `
            <b>${index + 1}. ${q.question}</b><br>
            Твоя відповідь: ${q.answers[chosen]}<br>
            ${chosen === q.correct
                ? "✅ Правильно!"
                : "❌ Правильна відповідь: " + q.answers[q.correct]}
            <br><small>${q.explanation}</small>
        `;

        review.appendChild(item);
    });
}

showQuestion();
</script>

</body>
</html>
